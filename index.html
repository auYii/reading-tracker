<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的阅读记录</title>

<style>
:root {
    --bg: #f6f4f1;
    --card: #ffffff;
    --text: #292725;
    --subtext: #85817c;
    --border: #e8e4df;
    --accent: #806b5c;
    --accent-light: #eee8e2;
    --danger: #b96b6b;
    --shadow: 0 8px 30px rgba(70, 60, 50, 0.07);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 1400px;
    margin: auto;
    padding: 30px;
}

/* 顶部 */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.logo h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 1px;
}

.logo p {
    margin: 7px 0 0;
    color: var(--subtext);
    font-size: 14px;
}

.header-actions {
    display: flex;
    gap: 10px;
}

.btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    transition: 0.2s;
}

.btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow);
}

.btn-primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}

.btn-danger {
    color: var(--danger);
}

/* 统计卡片 */

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: var(--shadow);
}

.stat-label {
    color: var(--subtext);
    font-size: 13px;
    margin-bottom: 10px;
}

.stat-value {
    font-size: 28px;
    font-weight: 600;
}

.stat-unit {
    font-size: 13px;
    color: var(--subtext);
    margin-left: 4px;
}

/* 页面主体 */

.content-grid {
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 20px;
}

.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
}

.panel-header {
    padding: 20px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.panel-title {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
}

.panel-body {
    padding: 20px;
}

/* 搜索 */

.search-area {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

.search-input {
    flex: 1;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
    background: var(--card);
    color: var(--text);
    transition: 0.2s;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--accent);
}

textarea {
    min-height: 120px;
    resize: vertical;
}

/* 小说列表 */

.book-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.book-item {
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 17px;
    transition: 0.2s;
}

.book-item:hover {
    box-shadow: 0 5px 20px rgba(70, 60, 50, 0.06);
    transform: translateY(-1px);
}

.book-main {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.book-info {
    min-width: 0;
}

.book-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 8px;
}

.book-meta {
    color: var(--subtext);
    font-size: 13px;
    line-height: 1.8;
}

.book-side {
    text-align: right;
    min-width: 110px;
}

.book-words {
    font-size: 20px;
    font-weight: 600;
}

.book-date {
    color: var(--subtext);
    font-size: 12px;
    margin-top: 4px;
}

.book-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 13px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}

.tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}

.tag {
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 20px;
    padding: 4px 9px;
    font-size: 11px;
}

.status {
    display: inline-block;
    border-radius: 20px;
    padding: 4px 9px;
    font-size: 11px;
}

.status-finished {
    background: #e8f0e7;
    color: #607b5e;
}

.status-reading {
    background: #eee8dd;
    color: #8a704c;
}

.status-dropped {
    background: #f1e5e5;
    color: #9a6262;
}

.status-want {
    background: #e7e9ef;
    color: #65708a;
}

.book-actions {
    display: flex;
    gap: 6px;
}

.small-btn {
    border: none;
    background: transparent;
    color: var(--subtext);
    font-size: 12px;
    padding: 4px 7px;
}

.small-btn:hover {
    color: var(--accent);
}

/* 右侧 */

.side-section {
    margin-bottom: 20px;
}

.side-section:last-child {
    margin-bottom: 0;
}

.side-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 14px;
}

/* 月度统计 */

.month-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.month-row {
    display: grid;
    grid-template-columns: 45px 1fr 70px;
    align-items: center;
    gap: 8px;
    font-size: 12px;
}

.month-name {
    color: var(--subtext);
}

.bar-bg {
    height: 8px;
    border-radius: 10px;
    background: #eeeae6;
    overflow: hidden;
}

.bar {
    height: 100%;
    background: var(--accent);
    border-radius: 10px;
}

.month-value {
    text-align: right;
    color: var(--subtext);
}

/* 时间线 */

.timeline {
    position: relative;
    padding-left: 20px;
}

.timeline::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 4px;
    bottom: 4px;
    width: 1px;
    background: var(--border);
}

.timeline-item {
    position: relative;
    margin-bottom: 18px;
}

.timeline-item::before {
    content: "";
    position: absolute;
    left: -20px;
    top: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
}

.timeline-date {
    color: var(--subtext);
    font-size: 11px;
    margin-bottom: 3px;
}

.timeline-title {
    font-size: 13px;
}

/* 空状态 */

.empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--subtext);
}

.empty-icon {
    font-size: 38px;
    margin-bottom: 10px;
}

/* 弹窗 */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 16, 0.45);
    z-index: 100;
    padding: 20px;
    overflow-y: auto;
}

.modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-content {
    width: min(720px, 100%);
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    overflow: hidden;
}

.modal-header {
    padding: 20px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    margin: 0;
    font-size: 19px;
}

.close {
    border: none;
    background: transparent;
    font-size: 25px;
    color: var(--subtext);
}

.modal-body {
    padding: 22px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.form-group {
    margin-bottom: 2px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-label {
    display: block;
    font-size: 13px;
    margin-bottom: 7px;
}

.required {
    color: var(--danger);
}

.modal-footer {
    padding: 15px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

/* 星星 */

.rating {
    display: flex;
    gap: 3px;
}

.star {
    font-size: 24px;
    color: #d9d2ca;
    cursor: pointer;
}

.star.active {
    color: #b28c54;
}

/* 图表 */

.chart-container {
    width: 100%;
    height: 240px;
    position: relative;
}

.chart {
    display: flex;
    height: 190px;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 5px 0;
}

.chart-column {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
}

.chart-bar {
    width: min(35px, 70%);
    background: var(--accent);
    border-radius: 5px 5px 0 0;
    min-height: 2px;
    transition: 0.3s;
}

.chart-bar:hover {
    opacity: 0.75;
}

.chart-label {
    font-size: 10px;
    color: var(--subtext);
}

.chart-value {
    font-size: 9px;
    color: var(--subtext);
}

/* Toast */

.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #292725;
    color: white;
    padding: 10px 18px;
    border-radius: 9px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 300;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* 响应式 */

@media (max-width: 900px) {
    .content-grid {
        grid-template-columns: 1fr;
    }

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .app {
        padding: 15px;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .header-actions {
        width: 100%;
    }

    .header-actions .btn {
        flex: 1;
    }

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .stat-card {
        padding: 16px;
    }

    .stat-value {
        font-size: 23px;
    }

    .book-main {
        flex-direction: column;
        gap: 8px;
    }

    .book-side {
        text-align: left;
    }

    .book-bottom {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- 顶部 -->
    <header class="header">

        <div class="logo">
            <h1>我的阅读记录</h1>
            <p>记录读过的故事，也记录当时的自己。</p>
        </div>

        <div class="header-actions">
            <button class="btn" onclick="exportData()">导出数据</button>

            <button class="btn" onclick="document.getElementById('importFile').click()">
                导入数据
            </button>

            <input
                type="file"
                id="importFile"
                accept=".json"
                style="display:none"
                onchange="importData(event)"
            >

            <button class="btn btn-primary" onclick="openAddModal()">
                ＋ 添加小说
            </button>
        </div>

    </header>


    <!-- 数据统计 -->

    <section class="stats-grid">

        <div class="stat-card">
            <div class="stat-label">今年阅读</div>
            <div class="stat-value">
                <span id="yearWords">0</span>
                <span class="stat-unit">w</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-label">本月阅读</div>
            <div class="stat-value">
                <span id="monthWords">0</span>
                <span class="stat-unit">w</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-label">今年小说</div>
            <div class="stat-value">
                <span id="yearBooks">0</span>
                <span class="stat-unit">本</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-label">全部小说</div>
            <div class="stat-value">
                <span id="totalBooks">0</span>
                <span class="stat-unit">本</span>
            </div>
        </div>

    </section>


    <!-- 主体 -->

    <div class="content-grid">

        <!-- 左侧小说 -->

        <main>

            <div class="panel">

                <div class="panel-header">

                    <h2 class="panel-title">我的书目</h2>

                    <select
                        id="statusFilter"
                        onchange="renderBooks()"
                        style="width:120px"
                    >
                        <option value="all">全部</option>
                        <option value="finished">已完成</option>
                        <option value="reading">在读</option>
                        <option value="want">想读</option>
                        <option value="dropped">弃读</option>
                    </select>

                </div>

                <div class="panel-body">

                    <div class="search-area">

                        <input
                            id="searchInput"
                            class="search-input"
                            placeholder="搜索小说、作者、主角或标签..."
                            oninput="renderBooks()"
                        >

                    </div>

                    <div id="bookList" class="book-list"></div>

                </div>

            </div>


            <!-- 年度图表 -->

            <div class="panel" style="margin-top:20px">

                <div class="panel-header">
                    <h2 class="panel-title" id="chartTitle">
                        2026 年阅读趋势
                    </h2>

                    <select
                        id="chartYear"
                        onchange="renderChart()"
                        style="width:100px"
                    ></select>
                </div>

                <div class="panel-body">

                    <div class="chart-container">
                        <div id="chart" class="chart"></div>
                    </div>

                </div>

            </div>

        </main>


        <!-- 右侧 -->

        <aside>

            <!-- 月度 -->

            <div class="panel side-section">

                <div class="panel-header">
                    <h2 class="panel-title">月度阅读</h2>
                </div>

                <div class="panel-body">

                    <div id="monthList" class="month-list"></div>

                </div>

            </div>


            <!-- 最近阅读 -->

            <div class="panel side-section">

                <div class="panel-header">
                    <h2 class="panel-title">阅读时间线</h2>
                </div>

                <div class="panel-body">

                    <div id="timeline" class="timeline"></div>

                </div>

            </div>

        </aside>

    </div>

</div>


<!-- 添加/编辑小说 -->

<div id="bookModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">添加小说</h2>

            <button class="close" onclick="closeModal()">×</button>

        </div>


        <div class="modal-body">

            <form id="bookForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label class="form-label">
                            小说名称 <span class="required">*</span>
                        </label>

                        <input
                            id="bookTitle"
                            required
                            placeholder="例如：某某"
                        >
                    </div>


                    <div class="form-group">
                        <label class="form-label">作者</label>

                        <input
                            id="bookAuthor"
                            placeholder="作者名称"
                        >
                    </div>


                    <div class="form-group">
                        <label class="form-label">主角</label>

                        <input
                            id="bookProtagonist"
                            placeholder="例如：A × B"
                        >
                    </div>


                    <div class="form-group">
                        <label class="form-label">
                            字数（万字）
                        </label>

                        <input
                            id="bookWords"
                            type="number"
                            step="0.1"
                            min="0"
                            placeholder="例如：120"
                        >
                    </div>


                    <div class="form-group">
                        <label class="form-label">阅读状态</label>

                        <select id="bookStatus">

                            <option value="finished">
                                已完成
                            </option>

                            <option value="reading">
                                在读
                            </option>

                            <option value="want">
                                想读
                            </option>

                            <option value="dropped">
                                弃读
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            评分
                        </label>

                        <div id="rating" class="rating">

                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>

                        </div>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            开始阅读
                        </label>

                        <input
                            id="startDate"
                            type="date"
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            结束阅读
                        </label>

                        <input
                            id="endDate"
                            type="date"
                        >

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            标签
                        </label>

                        <input
                            id="bookTags"
                            placeholder="用逗号分隔，例如：现代,BL,HE,无限流"
                        >

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            个人感受
                        </label>

                        <textarea
                            id="bookFeeling"
                            placeholder="记录一下读完之后的感觉……"
                        ></textarea>

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            名场面 / 备注
                        </label>

                        <textarea
                            id="bookNote"
                            placeholder="可以记录喜欢的角色、情节、名场面、吐槽等等……"
                        ></textarea>

                    </div>

                </div>

            </form>

        </div>


        <div class="modal-footer">

            <button class="btn" onclick="closeModal()">
                取消
            </button>

            <button
                class="btn btn-primary"
                onclick="saveBook()"
            >
                保存
            </button>

        </div>

    </div>

</div>


<!-- Toast -->

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   数据
==================
