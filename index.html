<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的阅读记录</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f6f3ef;
    --card: #ffffff;
    --text: #292725;
    --sub: #88827b;
    --border: #e8e2dc;
    --accent: #806b5c;
    --accent-light: #eee7e1;
    --danger: #b96565;
    --shadow: 0 8px 30px rgba(60, 45, 35, 0.07);
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 1400px;
    margin: 0 auto;
    padding: 30px;
}

/* ==================== 顶部 ==================== */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
}

.logo h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 600;
}

.logo p {
    margin: 7px 0 0;
    color: var(--sub);
    font-size: 14px;
}

.header-actions {
    display: flex;
    gap: 10px;
}

.btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    transition: 0.2s;
}

.btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow);
}

.btn-primary {
    color: white;
    background: var(--accent);
    border-color: var(--accent);
}

.btn-danger {
    color: var(--danger);
}

/* ==================== 统计 ==================== */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 22px;
}

.stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 21px;
    box-shadow: var(--shadow);
}

.stat-name {
    color: var(--sub);
    font-size: 13px;
    margin-bottom: 9px;
}

.stat-number {
    font-size: 28px;
    font-weight: 600;
}

.stat-unit {
    color: var(--sub);
    font-size: 13px;
    margin-left: 4px;
}

/* ==================== 主体 ==================== */

.layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 350px;
    gap: 20px;
}

.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
}

.panel + .panel {
    margin-top: 20px;
}

.panel-header {
    min-height: 64px;
    padding: 17px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.panel-title {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
}

.panel-body {
    padding: 20px;
}

/* ==================== 搜索 ==================== */

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

.search-box input {
    flex: 1;
}

/* ==================== 输入框 ==================== */

input,
select,
textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: white;
    color: var(--text);
    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--accent);
}

textarea {
    min-height: 120px;
    resize: vertical;
}

/* ==================== 小说列表 ==================== */

.book-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.book {
    padding: 17px;
    border: 1px solid var(--border);
    border-radius: 13px;
    transition: 0.2s;
}

.book:hover {
    box-shadow: 0 5px 20px rgba(50, 40, 30, 0.06);
}

.book-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.book-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 7px;
}

.book-info {
    color: var(--sub);
    font-size: 13px;
    line-height: 1.8;
}

.book-words {
    text-align: right;
    font-size: 20px;
    font-weight: 600;
    white-space: nowrap;
}

.book-status {
    margin-top: 5px;
    text-align: right;
}

.status {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 20px;
    font-size: 11px;
}

.status-finished {
    color: #607a5e;
    background: #e7f0e5;
}

.status-reading {
    color: #896d48;
    background: #f0e9dc;
}

.status-want {
    color: #66718a;
    background: #e7eaf1;
}

.status-dropped {
    color: #9b6262;
    background: #f1e4e4;
}

.book-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 13px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.tag {
    padding: 4px 9px;
    border-radius: 20px;
    color: var(--accent);
    background: var(--accent-light);
    font-size: 11px;
}

.rating {
    margin-top: 6px;
    color: #b28b53;
    font-size: 13px;
}

.book-buttons {
    display: flex;
    gap: 4px;
}

.text-button {
    border: none;
    background: transparent;
    color: var(--sub);
    padding: 5px 7px;
    font-size: 12px;
}

.text-button:hover {
    color: var(--accent);
}

/* ==================== 月度统计 ==================== */

.month-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.month-row {
    display: grid;
    grid-template-columns: 40px 1fr 65px;
    gap: 8px;
    align-items: center;
    font-size: 12px;
}

.month-name {
    color: var(--sub);
}

.progress-bg {
    height: 8px;
    background: #eeeae6;
    border-radius: 20px;
    overflow: hidden;
}

.progress {
    height: 100%;
    background: var(--accent);
    border-radius: 20px;
}

.month-value {
    text-align: right;
    color: var(--sub);
}

/* ==================== 图表 ==================== */

.chart {
    height: 240px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 5px;
}

.chart-column {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
}

.chart-bar {
    width: min(35px, 70%);
    min-height: 2px;
    background: var(--accent);
    border-radius: 5px 5px 0 0;
}

.chart-label,
.chart-value {
    font-size: 10px;
    color: var(--sub);
}

/* ==================== 时间线 ==================== */

.timeline {
    position: relative;
    padding-left: 20px;
}

.timeline::before {
    content: "";
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: 1px;
    background: var(--border);
}

.timeline-item {
    position: relative;
    margin-bottom: 18px;
}

.timeline-item::before {
    content: "";
    position: absolute;
    left: -20px;
    top: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
}

.timeline-date {
    color: var(--sub);
    font-size: 11px;
    margin-bottom: 3px;
}

.timeline-title {
    font-size: 13px;
}

/* ==================== 空状态 ==================== */

.empty {
    padding: 55px 20px;
    text-align: center;
    color: var(--sub);
}

.empty-icon {
    font-size: 38px;
    margin-bottom: 10px;
}

/* ==================== 弹窗 ==================== */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    padding: 20px;
    background: rgba(20, 18, 16, 0.48);
    overflow-y: auto;
}

.modal.show {
    display: flex;
    justify-content: center;
    align-items: center;
}

.modal-box {
    width: min(720px, 100%);
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
}

.modal-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-head h2 {
    margin: 0;
    font-size: 19px;
}

.close-button {
    border: none;
    background: transparent;
    color: var(--sub);
    font-size: 25px;
}

.modal-content {
    padding: 22px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
}

.form-footer {
    padding: 15px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

/* ==================== 星星 ==================== */

.stars {
    display: flex;
    gap: 3px;
}

.star {
    font-size: 25px;
    color: #d9d2ca;
    cursor: pointer;
}

.star.active {
    color: #b28b53;
}

/* ==================== Toast ==================== */

.toast {
    position: fixed;
    z-index: 3000;
    left: 50%;
    bottom: 25px;
    transform: translate(-50%, 20px);
    padding: 10px 18px;
    color: white;
    background: #292725;
    border-radius: 9px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* ==================== 详情 ==================== */

.detail-row {
    margin-bottom: 15px;
}

.detail-label {
    margin-bottom: 5px;
    color: var(--sub);
    font-size: 12px;
}

.detail-text {
    line-height: 1.8;
    white-space: pre-wrap;
}

/* ==================== 手机 ==================== */

@media (max-width: 900px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    .app {
        padding: 15px;
    }

    .header {
        display: block;
    }

    .header-actions {
        margin-top: 15px;
    }

    .header-actions .btn {
        flex: 1;
        padding: 9px 8px;
        font-size: 12px;
    }

    .stats {
        gap: 10px;
    }

    .stat {
        padding: 16px;
    }

    .stat-number {
        font-size: 22px;
    }

    .book-top {
        display: block;
    }

    .book-words {
        text-align: left;
        margin-top: 8px;
    }

    .book-status {
        text-align: left;
    }

    .book-bottom {
        align-items: flex-start;
        flex-direction: column;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- ==================== 顶部 ==================== -->

    <header class="header">

        <div class="logo">
            <h1>我的阅读记录</h1>
            <p>记录读过的故事，也记录当时的自己。</p>
        </div>

        <div class="header-actions">

            <button class="btn" id="exportBtn">
                导出数据
            </button>

            <button class="btn" id="importBtn">
                导入数据
            </button>

            <input
                type="file"
                id="importFile"
                accept=".json"
                style="display:none"
            >

            <button class="btn btn-primary" id="addBookBtn">
                ＋ 添加小说
            </button>

        </div>

    </header>


    <!-- ==================== 数据统计 ==================== -->

    <section class="stats">

        <div class="stat">
            <div class="stat-name">今年阅读</div>
            <div>
                <span class="stat-number" id="yearWords">0</span>
                <span class="stat-unit">w</span>
            </div>
        </div>

        <div class="stat">
            <div class="stat-name">本月阅读</div>
            <div>
                <span class="stat-number" id="monthWords">0</span>
                <span class="stat-unit">w</span>
            </div>
        </div>

        <div class="stat">
            <div class="stat-name">今年小说</div>
            <div>
                <span class="stat-number" id="yearBooks">0</span>
                <span class="stat-unit">本</span>
            </div>
        </div>

        <div class="stat">
            <div class="stat-name">全部小说</div>
            <div>
                <span class="stat-number" id="totalBooks">0</span>
                <span class="stat-unit">本</span>
            </div>
        </div>

    </section>


    <!-- ==================== 主体 ==================== -->

    <div class="layout">

        <main>

            <!-- 小说列表 -->

            <section class="panel">

                <div class="panel-header">

                    <h2 class="panel-title">
                        我的书目
                    </h2>

                    <select id="statusFilter" style="width:120px">

                        <option value="all">全部</option>
                        <option value="finished">已完成</option>
                        <option value="reading">在读</option>
                        <option value="want">想读</option>
                        <option value="dropped">弃读</option>

                    </select>

                </div>


                <div class="panel-body">

                    <div class="search-box">

                        <input
                            id="searchInput"
                            placeholder="搜索小说、作者、主角或标签"
                        >

                    </div>

                    <div id="bookList" class="book-list"></div>

                </div>

            </section>


            <!-- 年度统计 -->

            <section class="panel">

                <div class="panel-header">

                    <h2 class="panel-title" id="chartTitle">
                        阅读趋势
                    </h2>

                    <select id="chartYear" style="width:100px"></select>

                </div>

                <div class="panel-body">

                    <div id="chart" class="chart"></div>

                </div>

            </section>

        </main>


        <!-- ==================== 右侧 ==================== -->

        <aside>

            <section class="panel">

                <div class="panel-header">

                    <h2 class="panel-title">
                        月度阅读
                    </h2>

                </div>

                <div class="panel-body">

                    <div id="monthList" class="month-list"></div>

                </div>

            </section>


            <section class="panel">

                <div class="panel-header">

                    <h2 class="panel-title">
                        阅读时间线
                    </h2>

                </div>

                <div class="panel-body">

                    <div id="timeline" class="timeline"></div>

                </div>

            </section>

        </aside>

    </div>

</div>


<!-- ==================== 添加/编辑弹窗 ==================== -->

<div class="modal" id="bookModal">

    <div class="modal-box">

        <div class="modal-head">

            <h2 id="modalTitle">
                添加小说
            </h2>

            <button
                class="close-button"
                id="closeModalBtn"
            >
                ×
            </button>

        </div>


        <div class="modal-content">

            <form id="bookForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label class="form-label">
                            小说名称 *
                        </label>

                        <input
                            id="bookTitle"
                            required
                            placeholder="例如：某某"
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            作者
                        </label>

                        <input
                            id="bookAuthor"
                            placeholder="作者名称"
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            主角
                        </label>

                        <input
                            id="bookProtagonist"
                            placeholder="例如：A × B"
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            字数（万字）
                        </label>

                        <input
                            id="bookWords"
                            type="number"
                            min="0"
                            step="0.1"
                            placeholder="例如：120"
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            阅读状态
                        </label>

                        <select id="bookStatus">

                            <option value="finished">
                                已完成
                            </option>

                            <option value="reading">
                                在读
                            </option>

                            <option value="want">
                                想读
                            </option>

                            <option value="dropped">
                                弃读
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            评分
                        </label>

                        <div class="stars" id="rating">

                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>

                        </div>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            开始阅读
                        </label>

                        <input
                            id="startDate"
                            type="date"
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            结束阅读
                        </label>

                        <input
                            id="endDate"
                            type="date"
                        >

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            标签
                        </label>

                        <input
                            id="bookTags"
                            placeholder="例如：现代,BL,HE,无限流"
                        >

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            个人感受
                        </label>

                        <textarea
                            id="bookFeeling"
                            placeholder="记录一下读完之后的感觉……"
                        ></textarea>

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            名场面 / 备注
                        </label>

                        <textarea
                            id="bookNote"
                            placeholder="记录喜欢的角色、情节、名场面、吐槽等等……"
                        ></textarea>

                    </div>

                </div>

            </form>

        </div>


        <div class="form-footer">

            <button
                class="btn"
                id="cancelBtn"
            >
                取消
            </button>

            <button
