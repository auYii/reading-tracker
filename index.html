<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>我的阅读记录</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f6f3ee;
            color: #403b36;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e8e1d8;
            padding: 30px 6%;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            font-weight: 700;
        }

        .subtitle {
            color: #8b8177;
            font-size: 14px;
        }

        main {
            width: 100%;
            max-width: 1100px;
            margin: 28px auto;
            padding: 0 20px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #ddd5cc;
            border-radius: 9px;
            background: #ffffff;
            color: #403b36;
            padding: 11px 12px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #9aa88a;
        }

        textarea {
            min-height: 110px;
            max-height: 110px;
            resize: none;
            line-height: 1.6;
        }

        .btn {
            border: 0;
            border-radius: 9px;
            padding: 10px 16px;
            transition: 0.15s;
        }

        .btn:hover {
            opacity: 0.88;
        }

        .btn-primary {
            background: #69795c;
            color: #ffffff;
        }

        .btn-secondary {
            background: #ffffff;
            color: #514a43;
            border: 1px solid #ddd5cc;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #e8e1d8;
            border-radius: 14px;
            padding: 18px;
        }

        .stat-label {
            color: #91877e;
            font-size: 13px;
        }

        .stat-value {
            margin-top: 7px;
            font-size: 25px;
            font-weight: 700;
        }

        .content-grid {
            display: block;
        }

        
        .monthly-panel {
            margin-bottom: 14px;
        }

        .book-sortbar {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin: 0 0 12px;
        }

        .book-list-title {
            font-size:18px;
            font-weight:700;
        }

        .book-sortbar select {
            width:250px;
        }
        .chart-box {
            position: relative;
            height: 270px;
            padding: 10px 10px 34px 48px;
        }

        .chart-y-title {
            position: absolute;
            left: 3px;
            top: 12px;
            color: #91877e;
            font-size: 11px;
            writing-mode: vertical-rl;
            letter-spacing: 1px;
        }

        .month-chart {
            position: relative;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(12, minmax(18px, 1fr));
            align-items: end;
            gap: 9px;
            border-bottom: 1px solid #dcd5cd;
        }

        .month-chart::before,
        .month-chart::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px dashed #eee8e1;
            pointer-events: none;
        }

        .month-chart::before { top: 33.33%; }
        .month-chart::after { top: 66.66%; }

        .month-column {
            position: relative;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-width: 0;
        }

        .month-bar {
            position: relative;
            width: min(30px, 72%);
            min-height: 2px;
            background: #8b9a78;
            border-radius: 6px 6px 0 0;
            z-index: 1;
            transition: opacity .15s;
        }

        .month-bar:hover { opacity: .75; }

        .month-bar-value {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 5px);
            transform: translateX(-50%);
            color: #6e665e;
            font-size: 10px;
            white-space: nowrap;
        }

        .month-name {
            position: absolute;
            left: 50%;
            top: calc(100% + 8px);
            transform: translateX(-50%);
            color: #91877e;
            font-size: 11px;
            white-space: nowrap;
        }

        .sort-control {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .sort-label {
            color: #8d847b;
            font-size: 13px;
            white-space: nowrap;
        }


.panel {
            background: #ffffff;
            border: 1px solid #e8e1d8;
            border-radius: 14px;
            padding: 18px;
        }

        .panel-title {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .book-card {
            background: #ffffff;
            border: 1px solid #e8e1d8;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .book-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .book-title {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.4;
        }

        .book-meta {
            margin-top: 7px;
            color: #8d847b;
            font-size: 13px;
            line-height: 1.8;
        }

        .book-words {
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status {
            display: inline-block;
            margin-top: 5px;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
        }

        .status-reading {
            background: #edf3e8;
            color: #637452;
        }

        .status-finished {
            background: #eeeaf6;
            color: #71628b;
        }

        .status-want {
            background: #f5eee1;
            color: #947548;
        }

        .status-dropped {
            background: #f6e9e6;
            color: #a86459;
        }

        .tags {
            margin-top: 10px;
        }

        .tag {
            display: inline-block;
            margin: 3px 4px 3px 0;
            padding: 4px 9px;
            background: #f1eee9;
            border-radius: 20px;
            font-size: 12px;
            color: #716a63;
        }

        .rating {
            margin-top: 8px;
            color: #c28d45;
            letter-spacing: 2px;
        }

        .book-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .small-btn {
            border: 0;
            border-radius: 8px;
            padding: 7px 11px;
            background: #f5f2ed;
            color: #5c554e;
        }

        .small-btn:hover {
            background: #ece8e1;
        }

        .cp-display {
            margin-top: 10px;
            padding: 10px 12px;
            background: #faf8f5;
            border-radius: 9px;
            color: #5e574f;
            font-size: 14px;
            line-height: 1.7;
        }

        .cp-label {
            color: #968c83;
            font-size: 12px;
            margin-right: 6px;
        }

        .sub-cp-display {
            margin-top: 4px;
            color: #716960;
        }

        /* 小说卡片折叠 */
        .book-card {
            padding: 0;
            overflow: hidden;
        }
        .book-summary {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 100px 32px;
            align-items: center;
            gap: 14px;
            min-height: 68px;
            padding: 13px 18px;
            cursor: pointer;
        }

        .book-summary:hover { background: #faf8f5; }

        .summary-date {
            display: none;
        }

        .summary-title {
            min-width: 0;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .summary-words {
            min-width: 0;
            font-size: 16px;
            font-weight: 700;
            text-align: right;
            white-space: nowrap;
        }
        .summary-arrow { width:28px; height:28px; border-radius:50%; background:#f1eee9; color:#69795c; display:flex; align-items:center; justify-content:center; transition:.2s; }
        .book-card.open .summary-arrow { transform:rotate(180deg); }
        .book-detail { display:none; padding: 0 18px 18px; }
        .book-card.open .book-detail { display:block; }
        .book-detail-inner { border-top:1px solid #eee8e1; padding-top:16px; }
        .cp-display .main-cp-big { font-size:20px; font-weight:700; }
        .cp-display .sub-cp-display { font-size:16px; }
        @media (max-width:600px) {
            .book-summary {
                grid-template-columns: minmax(0,1fr) 68px 28px;
                gap: 8px;
                padding: 12px;
            }

            .summary-date {
                display: none;
            }

            .summary-title { font-size: 15px; }
            .summary-words { font-size: 13px; }

            .chart-box {
                height: 235px;
                padding-left: 38px;
            }

            .month-chart { gap: 4px; }
            .month-bar { width: min(22px, 78%); }
            .month-bar-value { font-size: 8px; }

            .book-sortbar {
                align-items: stretch;
                flex-direction: column;
            }

            .sort-control {
                width: 100%;
            }

            .sort-control select {
                flex: 1;
                width: 100%;
            }
        }

        .empty {
            text-align: center;
            padding: 55px 20px;
            color: #99918a;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .month-row {
            display: grid;
            grid-template-columns: 35px 1fr 55px;
            align-items: center;
            gap: 8px;
            margin: 11px 0;
            font-size: 12px;
        }

        .progress-bg {
            height: 10px;
            background: #eeeae4;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: #8b9a78;
            border-radius: 10px;
        }

        .timeline-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee8e1;
        }

        .timeline-item:last-child {
            border-bottom: 0;
        }

        .timeline-date {
            font-size: 12px;
            color: #978e85;
        }

        .timeline-title {
            margin-top: 4px;
            font-size: 14px;
            font-weight: 600;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.45);
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            position: relative;
            width: min(680px, 100%);
            max-height: calc(100vh - 80px);
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            position: sticky;
            top: -24px;
            padding-top: 2px;
            padding-bottom: 14px;
            background: #ffffff;
            z-index: 2;
        }

        .modal-head h2 {
            margin: 0;
            font-size: 21px;
        }

        .close-button {
            border: 0;
            background: transparent;
            color: #777;
            font-size: 28px;
            line-height: 1;
            padding: 3px 7px;
        }

        .close-button:hover {
            color: #333;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-field.full {
            grid-column: 1 / -1;
        }

        .form-field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #6f675f;
        }

        .form-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee8e1;
            position: sticky;
            bottom: -24px;
            background: #ffffff;
        }

        .cp-section {
            grid-column: 1 / -1;
            border: 1px solid #e7e0d7;
            border-radius: 12px;
            padding: 15px;
            background: #fcfaf7;
        }

        .cp-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .cp-section-title strong {
            font-size: 14px;
        }

        .person-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .person-group input {
            flex: 1;
        }

        .multiply {
            flex: 0 0 auto;
            color: #8e857d;
            font-weight: 600;
        }

        .remove-person {
            flex: 0 0 auto;
            width: 34px;
            height: 38px;
            border: 0;
            border-radius: 8px;
            background: #f2eeea;
            color: #8c8178;
            font-size: 16px;
        }

        .remove-person:hover {
            background: #eee7df;
            color: #b35c50;
        }

        .add-person-btn {
            border: 1px dashed #cfc5ba;
            background: #ffffff;
            color: #70665d;
            border-radius: 8px;
            padding: 7px 11px;
            font-size: 13px;
        }

        .add-person-btn:hover {
            background: #f7f3ee;
        }

        .sub-cp {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e7e0d7;
        }

        .sub-cp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .sub-cp-title {
            font-size: 13px;
            font-weight: 600;
        }

        .remove-cp-btn {
            border: 0;
            background: transparent;
            color: #a36d64;
            font-size: 12px;
        }

        .add-cp-btn {
            width: 100%;
            margin-top: 12px;
            padding: 9px;
            border: 1px dashed #cfc5ba;
            border-radius: 8px;
            background: #ffffff;
            color: #6f665e;
        }

        .add-cp-btn:hover {
            background: #f7f3ee;
        }

        .star-rating {
            display: flex;
            gap: 5px;
            font-size: 28px;
        }

        .star {
            color: #d3ccc3;
            cursor: pointer;
            user-select: none;
        }

        .star.active {
            color: #c28d45;
        }

        .detail-row {
            padding: 13px 0;
            border-bottom: 1px solid #eee8e1;
        }

        .detail-row:last-child {
            border-bottom: 0;
        }

        .detail-label {
            color: #978e85;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .detail-text {
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .detail-cp {
            padding: 9px 11px;
            margin-top: 7px;
            background: #faf8f5;
            border-radius: 8px;
        }

        .toast {
            position: fixed;
            z-index: 2000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            display: none;
            padding: 10px 18px;
            border-radius: 9px;
            background: #403b36;
            color: #ffffff;
            font-size: 14px;
        }

        .toast.show {
            display: block;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            header {
                padding: 25px 20px;
            }

            main {
                margin-top: 20px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-field.full {
                grid-column: auto;
            }

            .cp-section {
                grid-column: auto;
            }

            .modal {
                padding: 20px 12px;
            }

            .modal-box {
                max-height: calc(100vh - 40px);
                padding: 18px;
            }

            .modal-head {
                top: -18px;
            }

            .book-top {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <h1>
            我的阅读记录
        </h1>

        <div class="subtitle">
            记录读过的小说，也记录读完之后还剩多少余味。
        </div>

    </div>

</header>



<main>


    <div class="toolbar">

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="搜索小说、作者、人物、标签……"
            >

        </div>


        <div style="width:140px">

            <select id="statusFilter">

                <option value="all">
                    全部状态
                </option>

                <option value="reading">
                    在读
                </option>

                <option value="finished">
                    已完成
                </option>

                <option value="want">
                    想读
                </option>

                <option value="dropped">
                    弃读
                </option>

            </select>

        </div>


        <button
            class="btn btn-primary"
            id="addBookBtn"
        >
            ＋ 添加小说
        </button>


        <button
            class="btn btn-secondary"
            id="exportBtn"
        >
            导出数据
        </button>


        <button
            class="btn btn-secondary"
            id="importBtn"
        >
            导入数据
        </button>


        <input
            id="importFile"
            type="file"
            accept=".json"
            style="display:none"
        >

    </div>



    <section class="stats">


        <div class="stat-card">

            <div class="stat-label">
                今年阅读字数
            </div>

            <div
                class="stat-value"
                id="yearWords"
            >
                0w
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                本月阅读字数
            </div>

            <div
                class="stat-value"
                id="monthWords"
            >
                0w
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                今年完成小说
            </div>

            <div
                class="stat-value"
                id="yearBooks"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                累计记录
            </div>

            <div
                class="stat-value"
                id="totalBooks"
            >
                0
            </div>

        </div>


    </section>



    <div class="content-grid">


        <section>

            <div class="panel monthly-panel">

                <h2 class="panel-title">
                    今年每月阅读量
                </h2>

                <div class="chart-box">
                    <div class="chart-y-title">阅读字数（w）</div>
                    <div id="monthChart" class="month-chart"></div>
                </div>

            </div>

            <div class="book-sortbar">
                <div class="book-list-title">阅读记录</div>
                <div class="sort-control">
                    <span class="sort-label">排序</span>
                    <select id="sortFilter" aria-label="小说排序">
                        <option value="start-desc">按开始时间倒序</option>
                        <option value="start-asc">按开始时间正序</option>
                        <option value="words-desc">按字数倒序</option>
                    </select>
                </div>
            </div>

            <div id="bookList"></div>

        </section>


    </div>


</main>



<!-- 添加 / 编辑小说 -->

<div
    class="modal"
    id="bookModal"
>


    <div class="modal-box">


        <div class="modal-head">

            <h2 id="modalTitle">
                添加小说
            </h2>


            <button
                class="close-button"
                id="closeModalBtn"
                type="button"
            >
                ×
            </button>

        </div>



        <div class="form-grid">


            <div class="form-field">

                <label>
                    小说名称 *
                </label>

                <input
                    id="bookTitle"
                    type="text"
                    placeholder="例如：某某小说"
                >

            </div>



            <div class="form-field">

                <label>
                    作者
                </label>

                <input
                    id="bookAuthor"
                    type="text"
                    placeholder="作者名称"
                >

            </div>



            <div class="form-field">

                <label>
                    字数（w）
                </label>

                <input
                    id="bookWords"
                    type="number"
                    min="0"
                    step="0.1"
                    placeholder="例如：120"
                >

            </div>



            <div class="form-field">

                <label>
                    阅读状态
                </label>

                <select id="bookStatus">

                    <option value="reading">
                        在读
                    </option>

                    <option value="finished">
                        已完成
                    </option>

                    <option value="want">
                        想读
                    </option>

                    <option value="dropped">
                        弃读
                    </option>

                </select>

            </div>



            <!-- 主 CP -->

            <div class="cp-section">


                <div class="cp-section-title">

                    <strong>
                        主 CP
                    </strong>

                    <span
                        style="
                            font-size:12px;
                            color:#988e85;
                        "
                    >
                        可以添加多个人物
                    </span>

                </div>


                <div
                    id="mainCpContainer"
                ></div>


                <button
                    type="button"
                    class="add-person-btn"
                    id="addMainPersonBtn"
                >
                    ＋ 添加人物
                </button>


            </div>



            <!-- 副 CP -->

            <div class="cp-section">


                <div class="cp-section-title">

                    <strong>
                        副 CP
                    </strong>

                    <span
                        style="
                            font-size:12px;

            <!-- 开始时间 -->

            <!-- 结束时间 -->

            <div class="form-field">

                <input

                        ★
                    </span>

                    <span

                    >
                        ★
                    </span>

                    <span
                        class="star"
                        data-rating="3"
                    >
                        ★
                    </span>

                    <span
                        class="star"
                        data-rating="4"
                    >
                        ★
                    </span>

                    <span
                        class="star"
                        data-rating="5"
                    >
                        ★
                    </span>

                </div>

            </div>



            <!-- 个人感受 -->

            <div class="form-field full">

                <label>
                    个人感受
                </label>

                <textarea
                    id="bookFeeling"

<div
    class="modal"
    id="detailModal"
>


    <div class="modal-box">


        <div class="modal-head">

            <h2 id="detailTitle">
                小说详情
            </h2>


            <button
                class="close-button"
                id="closeDetailBtn"
                type="button"
            >
                ×
            </button>

        </div>


        <div id="detailContent"></div>


        <div class="form-footer">

            <button
                class="btn btn-secondary"
                id="closeDetailButton"
                type="button"
            >
                关闭
            </button>

        </div>


    </div>


</div>



<div
    class="toast"
    id="toast"
></div>



<script>


let books = [];

let editingId = null;

let currentRating = 0;

let subCpCounter = 0;



document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadData();

        bindEvents();

        renderAll();

    }
);



/* =========================
   数据
========================= */

function loadData() {

    try {

        const data =
            localStorage.getItem(
                "readingTrackerBooks"
            );

        if (data) {

            const parsed =
                JSON.parse(data);

            if (
                Array.isArray(parsed)
            ) {

                books = parsed;

            }

        }

    } catch (error) {

        console.error(error);

        books = [];

    }

}



function saveData() {

    localStorage.setItem(
        "readingTrackerBooks",
        JSON.stringify(books)
    );

}



/* =========================
   事件
========================= */

function bindEvents() {

    document
        .getElementById("addBookBtn")
        .addEventListener(
            "click",
            openAddModal
        );


    document
        .getElementById("closeModalBtn")
        .addEventListener(
            "click",
            closeBookModal
        );


    document
        .getElementById("cancelBtn")
        .addEventListener(
            "click",
            closeBookModal
        );


    document
        .getElementById("saveBtn")
        .addEventListener(
            "click",
            saveBook
        );


    document
        .getElementById("closeDetailBtn")
        .addEventListener(
            "click",
            closeDetailModal
        );


    document
        .getElementById("closeDetailButton")
        .addEventListener(
            "click",
            closeDetailModal
        );


    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            renderBooks
        );


    document
        .getElementById("statusFilter")
        .addEventListener(
            "change",
            renderBooks
        );


    document
        .getElementById("exportBtn")
        .addEventListener(
            "click",
            exportData
        );


    document
        .getElementById("importBtn")
        .addEventListener(
            "click",
            function () {

                document
                    .getElementById("importFile")
                    .click();

            }
        );


    document
        .getElementById("importFile")
        .addEventListener(
            "change",
            importData
        );


    document
        .getElementById("addMainPersonBtn")
        .addEventListener(
            "click",
            function () {

                addMainPerson();

            }
        );


    document
        .getElementById("addSubCpBtn")
        .addEventListener(
            "click",
            function () {

                addSubCp();

            }
        );


    document
        .querySelectorAll(".star")
        .forEach(
            function (star) {

                star.addEventListener(
                    "click",
                    function () {

                        currentRating =
                            Number(
                                this.dataset.rating
                            );

                        updateStars();

                    }
                );

            }
        );

}



/* =========================
   人物输入框
========================= */

function createPersonInput(
    value = "",
    removable = true
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "person-group";

    const input =
        document.createElement(
            "input"
        );

    input.type = "text";

    input.className =
        "person-input";

    input.placeholder =
        "请输入人名";

    input.value =
        value;

    wrapper.appendChild(
        input
    );

    const groups =
        document.querySelectorAll(
            "#mainCpContainer .person-group"
        );

    if (
        groups.length > 0
    ) {

        const multiply =
            document.createElement(
                "span"
            );

        multiply.className =
            "multiply";

        multiply.textContent =
            "×";

        wrapper.insertBefore(
            multiply,
            input
        );

    }

    if (removable) {

        const remove =
            document.createElement(
                "button"
            );

        remove.type =
            "button";

        remove.className =
            "remove-person";

        remove.textContent =
            "×";

        remove.title =
            "删除人物";

        remove.addEventListener(
            "click",
            function () {

                wrapper.remove();

                updatePersonMultiplication();

            }
        );

        wrapper.appendChild(
            remove
        );

    }

    return wrapper;

}



function addMainPerson(
    value = ""
) {

    const container =
        document.getElementById(
            "mainCpContainer"
        );

    const existing =
        container.querySelectorAll(
            ".person-group"
        );

    const group =
        createPersonInput(
            value,
            existing.length > 0
        );

    container.appendChild(
        group
    );

    updatePersonMultiplication();

}



function updatePersonMultiplication() {

    const groups =
        Array.from(
            document.querySelectorAll(
                "#mainCpContainer .person-group"
            )
        );

    groups.forEach(
        function (group, index) {

            const old =
                group.querySelector(
                    ".multiply"
                );

            if (old) {

                old.remove();

            }

            if (index > 0) {

                const multiply =
                    document.createElement(
                        "span"
                    );

                multiply.className =
                    "multiply";

                multiply.textContent =
                    "×";

                group.insertBefore(
                    multiply,
                    group.firstChild
                );

            }

            const remove =
                group.querySelector(
                    ".remove-person"
                );

            if (remove) {

                if (
                    groups.length <= 2 &&
                    index === 0
                ) {

                    remove.style.display =
                        "none";

                } else {

                    remove.style.display =
                        "";

                }

            }

        }
    );

}



/* =========================
   副 CP
========================= */

function createSubCp(
    people = ["", ""]
) {

    subCpCounter++;

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "sub-cp";

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "sub-cp-header";

    header.innerHTML = `

        <div class="sub-cp-title">
            副 CP ${subCpCounter}
        </div>

        <button
            type="button"
            class="remove-cp-btn"
        >
            删除这个副 CP
        </button>

    `;

    header
        .querySelector(
            ".remove-cp-btn"
        )
        .addEventListener(
            "click",
            function () {

                wrapper.remove();

                renumberSubCps();

            }
        );

    wrapper.appendChild(
        header
    );

    const peopleContainer =
        document.createElement(
            "div"
        );

    peopleContainer.className =
        "sub-cp-people";

    wrapper.appendChild(
        peopleContainer
    );

    people.forEach(
        function (person, index) {

            addSubPerson(
                peopleContainer,
                person,
                index > 1
            );

        }
    );

    const addPerson =
        document.createElement(
            "button"
        );

    addPerson.type =
        "button";

    addPerson.className =
        "add-person-btn";

    addPerson.textContent =
        "＋ 添加人物";

    addPerson.addEventListener(
        "click",
        function () {

            addSubPerson(
                peopleContainer,
                "",
                true
            );

        }
    );

    wrapper.appendChild(
        addPerson
    );

    return wrapper;

}



function addSubPerson(
    container,
    value = "",
    removable = true
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "person-group";

    const input =
        document.createElement(
            "input"
        );

    input.type =
        "text";

    input.className =
        "person-input";

    input.placeholder =
        "请输入人名";

    input.value =
        value;

    const current =
        container.querySelectorAll(
            ".person-group"
        );

    if (
        current.length > 0
    ) {

        const multiply =
            document.createElement(
                "span"
            );

        multiply.className =
            "multiply";

        multiply.textContent =
            "×";

        wrapper.appendChild(
            multiply
        );

    }

    wrapper.appendChild(
        input
    );

    if (removable) {

        const remove =
            document.createElement(
                "button"
            );

        remove.type =
            "button";

        remove.className =
            "remove-person";

        remove.textContent =
            "×";

        remove.title =
            "删除人物";

        remove.addEventListener(
            "click",
            function () {

                wrapper.remove();

                updateSubMultiplication(
                    container
                );

            }
        );

        wrapper.appendChild(
            remove
        );

    }

    container.appendChild(
        wrapper
    );

    updateSubMultiplication(
        container
    );

}



function updateSubMultiplication(
    container
) {

    const groups =
        Array.from(
            container.querySelectorAll(
                ".person-group"
            )
        );

    groups.forEach(
        function (group, index) {

            const old =
                group.querySelector(
                    ".multiply"
                );

            if (old) {

                old.remove();

            }

            if (index > 0) {

                const multiply =
                    document.createElement(
                        "span"
                    );

                multiply.className =
                    "multiply";

                multiply.textContent =
                    "×";

                group.insertBefore(
                    multiply,
                    group.firstChild
                );

            }

            const remove =
                group.querySelector(
                    ".remove-person"
                );

            if (remove) {

                if (
                    groups.length <= 2 &&
                    index === 0
                ) {

                    remove.style.display =
                        "none";

                } else {

                    remove.style.display =
                        "";

                }

            }

        }
    );

}



function addSubCp(
    people = ["", ""]
) {

    const container =
        document.getElementById(
            "subCpContainer"
        );

    const cp =
        createSubCp(
            people
        );

    container.appendChild(
        cp
    );

}



function renumberSubCps() {

    const list =
        document.querySelectorAll(
            "#subCpContainer .sub-cp"
        );

    list.forEach(
        function (cp, index) {

            const title =
                cp.querySelector(
                    ".sub-cp-title"
                );

            title.textContent =
                "副 CP " +
                (index + 1);

        }
    );

    subCpCounter =
        list.length;

}



/* =========================
   获取 CP
========================= */

function getMainCp() {

    const inputs =
        document.querySelectorAll(
            "#mainCpContainer .person-input"
        );

    return Array.from(
        inputs
    )
        .map(
            function (input) {

                return input.value.trim();

            }
        )
        .filter(
            function (value) {

                return value !== "";

            }
        );

}



function getSubCps() {

    const cps =
        document.querySelectorAll(
            "#subCpContainer .sub-cp"
        );

    return Array.from(
        cps
    )
        .map(
            function (cp) {

                const inputs =
                    cp.querySelectorAll(
                        ".person-input"
                    );

                return Array.from(
                    inputs
                )
                    .map(
                        function (input) {

                            return input.value.trim();

                        }
                    )
                    .filter(
                        function (value) {

                            return value !== "";

                        }
                    );

            }
        )
        .filter(
            function (people) {

                return people.length > 0;

            }
        );

}



/* =========================
   添加
========================= */

function openAddModal() {

    editingId = null;

    document
        .getElementById("modalTitle")
        .textContent =
        "添加小说";

    document
        .getElementById("bookTitle")
        .value = "";

    document
        .getElementById("bookAuthor")
        .value = "";

    document
        .getElementById("bookWords")
        .value = "";

    document
        .getElementById("bookStatus")
        .value =
        "reading";

    document
        .getElementById("bookTags")
        .value = "";

    document
        .getElementById("startDate")
        .value = "";

    document
        .getElementById("endDate")
        .value = "";

    document
        .getElementById("bookFeeling")
        .value = "";

    currentRating = 0;

    updateStars();

    document
        .getElementById(
            "mainCpContainer"
        )
        .innerHTML = "";

    document
        .getElementById(
            "subCpContainer"
        )
        .innerHTML = "";

    subCpCounter = 0;

    addMainPerson();

    addMainPerson();

    document
        .getElementById("bookModal")
        .classList.add("show");

}



/* =========================
   编辑
========================= */

function openEditModal(id) {

    const book =
        books.find(
            function (item) {

                return item.id === id;

            }
        );

    if (!book) {

        return;

    }

    editingId = id;

    document
        .getElementById("modalTitle")
        .textContent =
        "编辑小说";

    document
        .getElementById("bookTitle")
        .value =
        book.title || "";

    document
        .getElementById("bookAuthor")
        .value =
        book.author || "";

    document
        .getElementById("bookWords")
        .value =
        book.words || "";

    document
        .getElementById("bookStatus")
        .value =
        book.status || "reading";

    document
        .getElementById("bookTags")
        .value =
        Array.isArray(book.tags)
            ? book.tags.join(",")
            : "";

    document
        .getElementById("startDate")
        .value =
        book.startDate || "";

    document
        .getElementById("endDate")
        .value =
        book.endDate || "";

    document
        .getElementById("bookFeeling")
        .value =
        book.feeling || "";

    currentRating =
        Number(
            book.rating || 0
        );

    updateStars();

    document
        .getElementById(
            "mainCpContainer"
        )
        .innerHTML = "";

    document
        .getElementById(
            "subCpContainer"
        )
        .innerHTML = "";

    subCpCounter = 0;

    const mainCp =
        Array.isArray(
            book.mainCp
        )
            ? book.mainCp
            : [];

    if (
        mainCp.length >= 2
    ) {

        mainCp.forEach(
            function (person) {

                addMainPerson(
                    person
                );

            }
        );

    } else {

        addMainPerson();

        addMainPerson();

    }

    const subCps =
        Array.isArray(
            book.subCps
        )
            ? book.subCps
            : [];

    subCps.forEach(
        function (cp) {

            addSubCp(
                cp
            );

        }
    );

    document
        .getElementById("bookModal")
        .classList.add("show");

}



/* =========================
   保存
========================= */

function saveBook() {

    const title =
        document
            .getElementById("bookTitle")
            .value
            .trim();

    if (!title) {

        alert(
            "请输入小说名称。"
        );

        return;

    }

    const tags =
        document
            .getElementById("bookTags")
            .value
            .split(/[，,]/)
            .map(
                function (tag) {

                    return tag.trim();

                }
            )
            .filter(
                function (tag) {

                    return tag !== "";

                }
            );

    const book = {

        id:
            editingId ||
            Date.now().toString(),

        title:
            title,

        author:
            document
                .getElementById("bookAuthor")
                .value
                .trim(),

        words:
            Number(
                document
                    .getElementById("bookWords")
                    .value
            ) || 0,

        status:
            document
                .getElementById("bookStatus")
                .value,

        mainCp:
            getMainCp(),

        subCps:
            getSubCps(),

        tags:
            tags,

        rating:
            currentRating,

        startDate:
            document
                .getElementById("startDate")
                .value,

        endDate:
            document
                .getElementById("endDate")
                .value,

        feeling:
            document
                .getElementById("bookFeeling")
                .value
                .trim()

    };

    if (editingId) {

        const index =
            books.findIndex(
                function (item) {

                    return item.id === editingId;

                }
            );

        if (index !== -1) {

            books[index] =
                book;

        }

    } else {

        books.unshift(
            book
        );

    }

    saveData();

    closeBookModal();

    renderAll();

    showToast(
        editingId
            ? "小说已更新"
            : "小说已添加"
    );

}



/* =========================
   关闭
========================= */

function closeBookModal() {

    document
        .getElementById("bookModal")
        .classList.remove("show");

    editingId = null;

}



function closeDetailModal() {

    document
        .getElementById("detailModal")
        .classList.remove("show");

}



/* =========================
   小说列表
========================= */

function renderBooks() {
    renderMonthly();
    const container = document.getElementById("bookList");
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    const status = document.getElementById("statusFilter").value;

    const filtered = books
        .filter(function(book) {
            const statusOK = status === "all" || book.status === status;
            const allPeople = [
                ...(book.mainCp || []),
                ...(book.subCps || []).flat()
            ];
            const text = [
                book.title,
                book.author,
                ...allPeople,
                ...(book.tags || [])
            ].join(" ").toLowerCase();
            return statusOK && (keyword === "" || text.includes(keyword));
        })
        .sort(function(a,b) {
            const mode = document.getElementById("sortFilter")?.value || "start-desc";
            if (mode === "words-desc") {
                return Number(b.words || 0) - Number(a.words || 0);
            }
            // 排序选项：开始时间倒序、开始时间正序、字数倒序
            if (mode === "start-asc") {
                return new Date(a.startDate || "1900-01-01") - new Date(b.startDate || "1900-01-01");
            }
            return new Date(b.startDate || "1900-01-01") - new Date(a.startDate || "1900-01-01");
        });

    if (filtered.length === 0) {
        container.innerHTML = `<div class="panel empty"><div class="empty-icon">📖</div><div>${books.length === 0 ? "还没有记录小说" : "没有找到符合条件的小说"}</div><div style="margin-top:8px;font-size:12px">${books.length === 0 ? "点击右上角「添加小说」开始记录" : "试试其他搜索条件"}</div></div>`;
        return;
    }

    container.innerHTML = filtered.map(function(book) {
        const tags = (book.tags || []).map(function(tag) {
            return `<span class="tag">${escapeHtml(tag)}</span>`;
        }).join("");
        const rating = Number(book.rating || 0);
        const stars = "★".repeat(rating) + "☆".repeat(5-rating);
        const mainCpText = formatCp(book.mainCp);
        const subCpHtml = (book.subCps || []).map(function(cp,index) {
            return `<div class="sub-cp-display">副CP ${index+1}：${escapeHtml(formatCp(cp))}</div>`;
        }).join("");

        return `<article class="book-card" data-book-id="${escapeHtml(book.id)}">
            <div class="book-summary" onclick="toggleBookCard('${escapeHtml(book.id)}')">
                <div class="summary-date">${escapeHtml(getDateRange(book))}</div>
                <div class="summary-title">${escapeHtml(book.title)}</div>
                <div class="summary-words">${formatNumber(book.words)}w</div>
                <div class="summary-arrow">⌄</div>
            </div>

            <div class="book-detail">
                <div class="book-detail-inner">
                    <div class="book-top">
                        <div>
                            <div class="book-title">${escapeHtml(book.title)}</div>
                            <div class="book-meta">
                                ${book.author ? "作者：" + escapeHtml(book.author) + "<br>" : ""}
                                ${getDateRange(book)}
                                ${getReadingDays(book) ? "　·　" + getReadingDays(book) + "天" : ""}
                            </div>
                        </div>
                        <div>
                            <div class="book-words">${formatNumber(book.words)}w</div>
                            <span class="status status-${book.status}">${getStatusText(book.status)}</span>
                        </div>
                    </div>

                    ${mainCpText ? `<div class="cp-display"><span class="cp-label">主CP</span><span class="main-cp-big">${escapeHtml(mainCpText)}</span>${subCpHtml}</div>` : (subCpHtml ? `<div class="cp-display">${subCpHtml}</div>` : "")}
                    <div class="tags">${tags}</div>
                    ${rating ? `<div class="rating">${stars}</div>` : ""}

                    <div class="book-actions">
                        <button class="small-btn" onclick="event.stopPropagation();viewBook('${escapeHtml(book.id)}')">查看</button>
                        <button class="small-btn" onclick="event.stopPropagation();openEditModal('${escapeHtml(book.id)}')">编辑</button>
                        <button class="small-btn" onclick="event.stopPropagation();deleteBook('${escapeHtml(book.id)}')">删除</button>
                    </div>
                </div>
            </div>
        </article>`;
    }).join("");
}

function toggleBookCard(id) {
    const card = document.querySelector(`[data-book-id="${CSS.escape(id)}"]`);
    if (card) card.classList.toggle("open");
}


/* =========================
   详情
========================= */

function viewBook(id) {

    const book =
        books.find(
            function (item) {

                return item.id === id;

            }
        );

    if (!book) {

        return;

    }

    const rating =
        Number(
            book.rating || 0
        );

    const stars =
        "★".repeat(
            rating
        ) +
        "☆".repeat(
            5 - rating
        );

    document
        .getElementById("detailTitle")
        .textContent =
        book.title;

    const mainCp =
        formatCp(
            book.mainCp
        );

    const subCps =
        (book.subCps || [])
            .map(
                function (cp, index) {

                    return `

                        <div
                            class="detail-cp"
                        >
                            副CP ${index + 1}：
                            ${escapeHtml(
                                formatCp(cp)
                            )}
                        </div>

                    `;

                }
            )
            .join("");

    document
        .getElementById("detailContent")
        .innerHTML = `

            <div class="detail-row">

                <div class="detail-label">
                    作者
                </div>

                <div class="detail-text">
                    ${escapeHtml(
                        book.author ||
                        "未记录"
                    )}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    主CP
                </div>

                <div class="detail-text">

                    ${
                        mainCp
                            ? escapeHtml(
                                mainCp
                              )
                            : "未记录"
                    }

                </div>

                ${subCps}

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    字数
                </div>

                <div class="detail-text">
                    ${formatNumber(
                        book.words
                    )}w
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    阅读状态
                </div>

                <div class="detail-text">
                    ${getStatusText(
                        book.status
                    )}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    阅读时间
                </div>

                <div class="detail-text">

                    ${getDateRange(
                        book
                    )}

                    ${
                        getReadingDays(
                            book
                        )
                            ? "　·　" +
                              getReadingDays(
                                  book
                              ) +
                              "天"
                            : ""
                    }

                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    评分
                </div>

                <div class="rating">
                    ${stars}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    标签
                </div>

                <div>

                    ${
                        (book.tags || [])
                            .map(
                                function (tag) {

                                    return `

                                        <span class="tag">
                                            ${escapeHtml(
                                                tag
                                            )}
                                        </span>

                                    `;

                                }
                            )
                            .join("")
                        ||
                        "暂无"
                    }

                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    个人感受
                </div>

                <div class="detail-text">
                    ${escapeHtml(
                        book.feeling ||
                        "暂无记录"
                    )}
                </div>

            </div>

        `;

    document
        .getElementById("detailModal")
        .classList.add("show");

}



/* =========================
   删除
========================= */

function deleteBook(id) {

    const book =
        books.find(
            function (item) {

                return item.id === id;

            }
        );

    if (!book) {

        return;

    }

    if (
        !confirm(
            "确定删除《" +
            book.title +
            "》吗？"
        )
    ) {

        return;

    }

    books =
        books.filter(
            function (item) {

                return item.id !== id;

            }
        );

    saveData();

    renderAll();

    showToast(
        "小说已删除"
    );

}



/* =========================
   统计
========================= */


function renderMonthly() {
    const year = new Date().getFullYear();
    const values = Array(12).fill(0);

    books.forEach(function(book) {
        const date = book.startDate || "";
        if (date.startsWith(String(year) + "-")) {
            const month = parseInt(date.slice(5, 7), 10);
            if (month >= 1 && month <= 12) {
                values[month - 1] += Number(book.words || 0);
            }
        }
    });

    const maxValue = Math.max(...values, 1);
    const chart = document.getElementById("monthChart");

    chart.innerHTML = values.map(function(value, index) {
        const height = value > 0
            ? Math.max(3, value / maxValue * 100)
            : 2;

        return `<div class="month-column">
            <div class="month-bar" style="height:${height}%">
                <span class="month-bar-value">${formatNumber(value)}w</span>
            </div>
            <span class="month-name">${index + 1}月</span>
        </div>`;
    }).join("");
}

function renderStats() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        now.getMonth() + 1;

    const yearBooks =
        books.filter(
            function (book) {

                if (!book.startDate) {

                    return false;

                }

                const date =
                    new Date(
                        book.startDate
                    );

                return (
                    date.getFullYear() ===
                    year
                );

            }
        );

    const yearWords =
        yearBooks.reduce(
            function (sum, book) {

                return (
                    sum +
                    Number(
                        book.words || 0
                    )
                );

            },
            0
        );

    const monthWords =
        yearBooks
            .filter(
                function (book) {

                    const date =
                        new Date(
                            book.startDate
                        );

                    return (
                        date.getMonth() + 1 ===
                        month
                    );

                }
            )
            .reduce(
                function (sum, book) {

                    return (
                        sum +
                        Number(
                            book.words || 0
                        )
                    );

                },
                0
            );

    document
        .getElementById("yearWords")
        .textContent =
        formatNumber(
            yearWords
        ) +
        "w";

    document
        .getElementById("monthWords")
        .textContent =
        formatNumber(
            monthWords
        ) +
        "w";

    document
        .getElementById("yearBooks")
        .textContent =
        yearBooks.filter(
            function (book) {

                return (
                    book.status ===
                    "finished"
                );

            }
        ).length;

    document
        .getElementById("totalBooks")
        .textContent =
        books.length;

}



/* =========================
   月度统计
========================= */

function renderMonthList() {

    const container =
        document.getElementById(
            "monthList"
        );

    const year =
        new Date().getFullYear();

    const values = [];

    for (
        let month = 1;
        month <= 12;
        month++
    ) {

        let total = 0;

        books.forEach(
            function (book) {

                if (!book.startDate) {

                    return;

                }

                const date =
                    new Date(
                        book.startDate
                    );

                if (
                    date.getFullYear() === year &&
                    date.getMonth() + 1 === month
                ) {

                    total +=
                        Number(
                            book.words || 0
                        );

                }

            }
        );

        values.push(
            total
        );

    }

    const max =
        Math.max(
            ...values,
            1
        );

    container.innerHTML =
        values
            .map(
                function (
                    value,
                    index
                ) {

                    const width =
                        value /
                        max *
                        100;

                    return `

                        <div
                            class="month-row"
                        >

                            <div>
                                ${index + 1}月
                            </div>

                            <div
                                class="progress-bg"
                            >

                                <div
                                    class="progress"
                                    style="
                                        width:${width}%;
                                    "
                                ></div>

                            </div>

                            <div>
                                ${formatNumber(
                                    value
                                )}w
                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}



/* =========================
   最近阅读
========================= */

function renderTimeline() {

    const container =
        document.getElementById(
            "timeline"
        );

    const list =
        books
            .filter(
                function (book) {

                    return Boolean(
                        book.startDate
                    );

                }
            )
            .sort(
                function (a, b) {

                    return (
                        new Date(
                            b.startDate
                        ) -
                        new Date(
                            a.startDate
                        )
                    );

                }
            )
            .slice(
                0,
                8
            );

    if (
        list.length === 0
    ) {

        container.innerHTML = `

            <div class="book-meta">
                暂无阅读时间记录
            </div>

        `;

        return;

    }

    container.innerHTML =
        list
            .map(
                function (book) {

                    return `

                        <div
                            class="timeline-item"
                        >

                            <div
                                class="timeline-date"
                            >
                                ${formatDate(
                                    book.startDate
                                )}
                            </div>

                            <div
                                class="timeline-title"
                            >
                                ${escapeHtml(
                                    book.title
                                )}
                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}



/* =========================
   星星
========================= */

function updateStars() {

    document
        .querySelectorAll(".star")
        .forEach(
            function (star) {

                const rating =
                    Number(
                        star.dataset.rating
                    );

                if (
                    rating <=
                    currentRating
                ) {

                    star.classList.add(
                        "active"
                    );

                } else {

                    star.classList.remove(
                        "active"
                    );

                }

            }
        );

}



/* =========================
   导出
========================= */

function exportData() {

    const blob =
        new Blob(
            [
                JSON.stringify(
                    books,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const a =
        document.createElement(
            "a"
        );

    a.href =
        url;

    a.download =
        "我的阅读记录.json";

    document
        .body
        .appendChild(
            a
        );

    a.click();

    a.remove();

    URL.revokeObjectURL(
        url
    );

    showToast(
        "数据已导出"
    );

}



/* =========================
   导入
========================= */

function importData(event) {

    const file =
        event.target.files[0];

    if (!file) {

        return;

    }

    const reader =
        new FileReader();

    reader.onload =
        function (e) {

            try {

                const data =
                    JSON.parse(
                        e.target.result
                    );

                if (
                    !Array.isArray(
                        data
                    )
                ) {

                    throw new Error(
                        "invalid"
                    );

                }

                if (
                    !confirm(
                        "导入数据会覆盖当前阅读记录，确定继续吗？"
                    )
                ) {

                    return;

                }

                books =
                    data;

                saveData();

                renderAll();

                showToast(
                    "数据导入成功"
                );

            } catch (error) {

                alert(
                    "导入失败：文件格式不正确。"
                );

            }

        };

    reader.readAsText(
        file
    );

    event.target.value =
        "";

}



/* =========================
   工具函数
========================= */

function renderAll() {

    renderStats();

    renderMonthly();

    renderBooks();

}



function formatCp(
    people
) {

    if (
        !Array.isArray(
            people
        ) ||
        people.length === 0
    ) {

        return "";

    }

    return people.join(
        " × "
    );

}



function getStatusText(
    status
) {

    const map = {

        reading: "在读",

        finished: "已完成",

        want: "想读",

        dropped: "弃读"

    };

    return (
        map[status] ||
        "未知"
    );

}



function getReadingDays(
    book
) {

    if (
        !book.startDate
    ) {

        return null;

    }

    const start =
        new Date(
            book.startDate
        );

    const end =
        book.endDate
            ? new Date(
                book.endDate
            )
            : new Date();

    return Math.max(
        1,
        Math.floor(
            (
                end -
                start
            ) /
            86400000
        ) + 1
    );

}



function getDateRange(
    book
) {

    if (
        !book.startDate
    ) {

        return "未记录阅读时间";

    }

    if (
        !book.endDate
    ) {

        return (
            formatDate(
                book.startDate
            ) +
            " - 至今"
        );

    }

    return (
        formatDate(
            book.startDate
        ) +
        " - " +
        formatDate(
            book.endDate
        )
    );

}



function formatDate(
    value
) {

    if (!value) {

        return "";

    }

    const date =
        new Date(
            value
        );

    return (
        date.getFullYear() +
        "." +
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "." +
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        )
    );

}



function formatNumber(value) {
    return Number(value || 0).toLocaleString("zh-CN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function escapeHtml(
    value
) {

    return String(
        value || ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================
   Toast
========================= */

let toastTimer;


function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            function () {

                toast.classList.remove(
                    "show"
                );

            },
            2000
        );

}



document.getElementById("sortFilter").addEventListener("change", function() {
    renderBooks();
});
</script>
