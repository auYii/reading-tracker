<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的阅读记录</title>

<style>
:root {
    --bg: #f6f4f1;
    --card: #ffffff;
    --text: #292725;
    --subtext: #85817c;
    --border: #e8e4df;
    --accent: #806b5c;
    --accent-light: #eee8e2;
    --danger: #b96b6b;
    --shadow: 0 8px 30px rgba(70, 60, 50, 0.07);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 1400px;
    margin: auto;
    padding: 30px;
}

/* 顶部 */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.logo h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 1px;
}

.logo p {
    margin: 7px 0 0;
    color: var(--subtext);
    font-size: 14px;
}

.header-actions {
    display: flex;
    gap: 10px;
}

.btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    transition: 0.2s;
}

.btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow);
}

.btn-primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}

.btn-danger {
    color: var(--danger);
}

/* 统计卡片 */

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: var(--shadow);
}

.stat-label {
    color: var(--subtext);
    font-size: 13px;
    margin-bottom: 10px;
}

.stat-value {
    font-size: 28px;
    font-weight: 600;
}

.stat-unit {
    font-size: 13px;
    color: var(--subtext);
    margin-left: 4px;
}

/* 页面主体 */

.content-grid {
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 20px;
}

.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
}

.panel-header {
    padding: 20px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.panel-title {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
}

.panel-body {
    padding: 20px;
}

/* 搜索 */

.search-area {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

.search-input {
    flex: 1;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
    background: var(--card);
    color: var(--text);
    transition: 0.2s;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--accent);
}

textarea {
    min-height: 120px;
    resize: vertical;
}

/* 小说列表 */

.book-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.book-item {
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 17px;
    transition: 0.2s;
}

.book-item:hover {
    box-shadow: 0 5px 20px rgba(70, 60, 50, 0.06);
    transform: translateY(-1px);
}

.book-main {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.book-info {
    min-width: 0;
}

.book-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 8px;
}

.book-meta {
    color: var(--subtext);
    font-size: 13px;
    line-height: 1.8;
}

.book-side {
    text-align: right;
    min-width: 110px;
}

.book-words {
    font-size: 20px;
    font-weight: 600;
}

.book-date {
    color: var(--subtext);
    font-size: 12px;
    margin-top: 4px;
}

.book-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 13px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}

.tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}

.tag {
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 20px;
    padding: 4px 9px;
    font-size: 11px;
}

.status {
    display: inline-block;
    border-radius: 20px;
    padding: 4px 9px;
    font-size: 11px;
}

.status-finished {
    background: #e8f0e7;
    color: #607b5e;
}

.status-reading {
    background: #eee8dd;
    color: #8a704c;
}

.status-dropped {
    background: #f1e5e5;
    color: #9a6262;
}

.status-want {
    background: #e7e9ef;
    color: #65708a;
}

.book-actions {
    display: flex;
    gap: 6px;
}

.small-btn {
    border: none;
    background: transparent;
    color: var(--subtext);
    font-size: 12px;
    padding: 4px 7px;
}

.small-btn:hover {
    color: var(--accent);
}

/* 右侧 */

.side-section {
    margin-bottom: 20px;
}

.side-section:last-child {
    margin-bottom: 0;
}

.side-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 14px;
}

/* 月度统计 */

.month-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.month-row {
    display: grid;
    grid-template-columns: 45px 1fr 70px;
    align-items: center;
    gap: 8px;
    font-size: 12px;
}

.month-name {
    color: var(--subtext);
}

.bar-bg {
    height: 8px;
    border-radius: 10px;
    background: #eeeae6;
    overflow: hidden;
}

.bar {
    height: 100%;
    background: var(--accent);
    border-radius: 10px;
}

.month-value {
    text-align: right;
    color: var(--subtext);
}

/* 时间线 */

.timeline {
    position: relative;
    padding-left: 20px;
}

.timeline::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 4px;
    bottom: 4px;
    width: 1px;
    background: var(--border);
}

.timeline-item {
    position: relative;
    margin-bottom: 18px;
}

.timeline-item::before {
    content: "";
    position: absolute;
    left: -20px;
    top: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
}

.timeline-date {
    color: var(--subtext);
    font-size: 11px;
    margin-bottom: 3px;
}

.timeline-title {
    font-size: 13px;
}

/* 空状态 */

.empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--subtext);
}

.empty-icon {
    font-size: 38px;
    margin-bottom: 10px;
}

/* 弹窗 */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 16, 0.45);
    z-index: 100;
    padding: 20px;
    overflow-y: auto;
}

.modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-content {
    width: min(720px, 100%);
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    overflow: hidden;
}

.modal-header {
    padding: 20px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    margin: 0;
    font-size: 19px;
}

.close {
    border: none;
    background: transparent;
    font-size: 25px;
    color: var(--subtext);
}

.modal-body {
    padding: 22px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.form-group {
    margin-bottom: 2px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-label {
    display: block;
    font-size: 13px;
    margin-bottom: 7px;
}

.required {
    color: var(--danger);
}

.modal-footer {
    padding: 15px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

/* 星星 */

.rating {
    display: flex;
    gap: 3px;
}

.star {
    font-size: 24px;
    color: #d9d2ca;
    cursor: pointer;
}

.star.active {
    color: #b28c54;
}

/* 图表 */

.chart-container {
    width: 100%;
    height: 240px;
    position: relative;
}

.chart {
    display: flex;
    height: 190px;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 5px 0;
}

.chart-column {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
}

.chart-bar {
    width: min(35px, 70%);
    background: var(--accent);
    border-radius: 5px 5px 0 0;
    min-height: 2px;
    transition: 0.3s;
}

.chart-bar:hover {
    opacity: 0.75;
}

.chart-label {
    font-size: 10px;
    color: var(--subtext);
}

.chart-value {
    font-size: 9px;
    color: var(--subtext);
}

/* Toast */

.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #292725;
    color: white;
    padding: 10px 18px;
    border-radius: 9px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 300;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* 响应式 */

@media (max-width: 900px) {
    .content-grid {
        grid-template-columns: 1fr;
    }

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .app {
        padding: 15px;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .header-actions {
        width: 100%;
    }

    .header-actions .btn {
        flex: 1;
    }

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .stat-card {
        padding: 16px;
    }

    .stat-value {
        font-size: 23px;
    }

    .book-main {
        flex-direction: column;
        gap: 8px;
    }

    .book-side {
        text-align: left;
    }

    .book-bottom {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- 顶部 -->
    <header class="header">

        <div class="logo">
            <h1>我的阅读记录</h1>
            <p>记录读过的故事，也记录当时的自己。</p>
        </div>

        <div class="header-actions">
            <button class="btn" onclick="exportData()">导出数据</button>

            <button class="btn" onclick="document.getElementById('importFile').click()">
                导入数据
            </button>

            <input
                type="file"
                id="importFile"
                accept=".json"
                style="display:none"
                onchange="importData(event)"
            >

            <button class="btn btn-primary" onclick="openAddModal()">
                ＋ 添加小说
            </button>
        </div>

    </header>


    <!-- 数据统计 -->

    <section class="stats-grid">

        <div class="stat-card">
            <div class="stat-label">今年阅读</div>
            <div class="stat-value">
                <span id="yearWords">0</span>
                <span class="stat-unit">w</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-label">本月阅读</div>
            <div class="stat-value">
                <span id="monthWords">0</span>
                <span class="stat-unit">w</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-label">今年小说</div>
            <div class="stat-value">
                <span id="yearBooks">0</span>
                <span class="stat-unit">本</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-label">全部小说</div>
            <div class="stat-value">
                <span id="totalBooks">0</span>
                <span class="stat-unit">本</span>
            </div>
        </div>

    </section>


    <!-- 主体 -->

    <div class="content-grid">

        <!-- 左侧小说 -->

        <main>

            <div class="panel">

                <div class="panel-header">

                    <h2 class="panel-title">我的书目</h2>

                    <select
                        id="statusFilter"
                        onchange="renderBooks()"
                        style="width:120px"
                    >
                        <option value="all">全部</option>
                        <option value="finished">已完成</option>
                        <option value="reading">在读</option>
                        <option value="want">想读</option>
                        <option value="dropped">弃读</option>
                    </select>

                </div>

                <div class="panel-body">

                    <div class="search-area">

                        <input
                            id="searchInput"
                            class="search-input"
                            placeholder="搜索小说、作者、主角或标签..."
                            oninput="renderBooks()"
                        >

                    </div>

                    <div id="bookList" class="book-list"></div>

                </div>

            </div>


            <!-- 年度图表 -->

            <div class="panel" style="margin-top:20px">

                <div class="panel-header">
                    <h2 class="panel-title" id="chartTitle">
                        2026 年阅读趋势
                    </h2>

                    <select
                        id="chartYear"
                        onchange="renderChart()"
                        style="width:100px"
                    ></select>
                </div>

                <div class="panel-body">

                    <div class="chart-container">
                        <div id="chart" class="chart"></div>
                    </div>

                </div>

            </div>

        </main>


        <!-- 右侧 -->

        <aside>

            <!-- 月度 -->

            <div class="panel side-section">

                <div class="panel-header">
                    <h2 class="panel-title">月度阅读</h2>
                </div>

                <div class="panel-body">

                    <div id="monthList" class="month-list"></div>

                </div>

            </div>


            <!-- 最近阅读 -->

            <div class="panel side-section">

                <div class="panel-header">
                    <h2 class="panel-title">阅读时间线</h2>
                </div>

                <div class="panel-body">

                    <div id="timeline" class="timeline"></div>

                </div>

            </div>

        </aside>

    </div>

</div>


<!-- 添加/编辑小说 -->

<div id="bookModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">添加小说</h2>

            <button class="close" onclick="closeModal()">×</button>

        </div>


        <div class="modal-body">

            <form id="bookForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label class="form-label">
                            小说名称 <span class="required">*</span>
                        </label>

                        <input
                            id="bookTitle"
                            required
                            placeholder="例如：某某"
                        >
                    </div>


                    <div class="form-group">
                        <label class="form-label">作者</label>

                        <input
                            id="bookAuthor"
                            placeholder="作者名称"
                        >
                    </div>


                    <div class="form-group">
                        <label class="form-label">主角</label>

                        <input
                            id="bookProtagonist"
                            placeholder="例如：A × B"
                        >
                    </div>


                    <div class="form-group">
                        <label class="form-label">
                            字数（万字）
                        </label>

                        <input
                            id="bookWords"
                            type="number"
                            step="0.1"
                            min="0"
                            placeholder="例如：120"
                        >
                    </div>


                    <div class="form-group">
                        <label class="form-label">阅读状态</label>

                        <select id="bookStatus">

                            <option value="finished">
                                已完成
                            </option>

                            <option value="reading">
                                在读
                            </option>

                            <option value="want">
                                想读
                            </option>

                            <option value="dropped">
                                弃读
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            评分
                        </label>

                        <div id="rating" class="rating">

                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>

                        </div>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            开始阅读
                        </label>

                        <input
                            id="startDate"
                            type="date"
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            结束阅读
                        </label>

                        <input
                            id="endDate"
                            type="date"
                        >

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            标签
                        </label>

                        <input
                            id="bookTags"
                            placeholder="用逗号分隔，例如：现代,BL,HE,无限流"
                        >

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            个人感受
                        </label>

                        <textarea
                            id="bookFeeling"
                            placeholder="记录一下读完之后的感觉……"
                        ></textarea>

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            名场面 / 备注
                        </label>

                        <textarea
                            id="bookNote"
                            placeholder="可以记录喜欢的角色、情节、名场面、吐槽等等……"
                        ></textarea>

                    </div>

                </div>

            </form>

        </div>


        <div class="modal-footer">

            <button class="btn" onclick="closeModal()">
                取消
            </button>

            <button
                class="btn btn-primary"
                onclick="saveBook()"
            >
                保存
            </button>

        </div>

    </div>

</div>


<!-- Toast -->

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   数据
========================================================= */

let books = JSON.parse(
    localStorage.getItem("readingBooks") || "[]"
);

let editingId = null;
let currentRating = 0;


/* =========================================================
   初始化
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    initializeYearSelect();

    renderAll();

    setupRating();

});


/* =========================================================
   保存
========================================================= */

function saveToStorage() {

    localStorage.setItem(
        "readingBooks",
        JSON.stringify(books)
    );

}


/* =========================================================
   ID
========================================================= */

function createId() {

    return Date.now().toString(36) +
        Math.random().toString(36).substr(2, 6);

}


/* =========================================================
   添加小说
========================================================= */

function openAddModal() {

    editingId = null;

    document.getElementById("modalTitle").textContent =
        "添加小说";

    document.getElementById("bookForm").reset();

    currentRating = 0;

    updateStars();

    document.getElementById("bookModal")
        .classList.add("active");

}


/* =========================================================
   编辑小说
========================================================= */

function openEditModal(id) {

    const book = books.find(b => b.id === id);

    if (!book) return;

    editingId = id;

    document.getElementById("modalTitle").textContent =
        "编辑小说";

    document.getElementById("bookTitle").value =
        book.title || "";

    document.getElementById("bookAuthor").value =
        book.author || "";

    document.getElementById("bookProtagonist").value =
        book.protagonist || "";

    document.getElementById("bookWords").value =
        book.words || "";

    document.getElementById("bookStatus").value =
        book.status || "finished";

    document.getElementById("startDate").value =
        book.startDate || "";

    document.getElementById("endDate").value =
        book.endDate || "";

    document.getElementById("bookTags").value =
        (book.tags || []).join(",");

    document.getElementById("bookFeeling").value =
        book.feeling || "";

    document.getElementById("bookNote").value =
        book.note || "";

    currentRating = book.rating || 0;

    updateStars();

    document.getElementById("bookModal")
        .classList.add("active");

}


/* =========================================================
   关闭弹窗
========================================================= */

function closeModal() {

    document.getElementById("bookModal")
        .classList.remove("active");

}


/* =========================================================
   保存小说
========================================================= */

function saveBook() {

    const title =
        document.getElementById("bookTitle")
            .value.trim();

    if (!title) {

        showToast("请输入小说名称");

        return;

    }


    const book = {

        id: editingId || createId(),

        title: title,

        author:
            document.getElementById("bookAuthor")
                .value.trim(),

        protagonist:
            document.getElementById("bookProtagonist")
                .value.trim(),

        words:
            parseFloat(
                document.getElementById("bookWords")
                    .value
            ) || 0,

        status:
            document.getElementById("bookStatus")
                .value,

        rating: currentRating,

        startDate:
            document.getElementById("startDate")
                .value,

        endDate:
            document.getElementById("endDate")
                .value,

        tags:
            document.getElementById("bookTags")
                .value
                .split(",")
                .map(x => x.trim())
                .filter(Boolean),

        feeling:
            document.getElementById("bookFeeling")
                .value.trim(),

        note:
            document.getElementById("bookNote")
                .value.trim(),

        updatedAt:
            new Date().toISOString()

    };


    if (editingId) {

        const index =
            books.findIndex(b => b.id === editingId);

        if (index !== -1) {

            books[index] = book;

        }

        showToast("小说已更新");

    } else {

        books.unshift(book);

        showToast("小说已添加");

    }


    saveToStorage();

    closeModal();

    renderAll();

}


/* =========================================================
   删除
========================================================= */

function deleteBook(id) {

    const book =
        books.find(b => b.id === id);

    if (!book) return;

    if (
        !confirm(
            `确定要删除《${book.title}》吗？`
        )
    ) {
        return;
    }


    books =
        books.filter(b => b.id !== id);

    saveToStorage();

    renderAll();

    showToast("已删除");

}


/* =========================================================
   状态
========================================================= */

function getStatusText(status) {

    const map = {

        finished: "已完成",

        reading: "在读",

        want: "想读",

        dropped: "弃读"

    };

    return map[status] || "未知";

}


/* =========================================================
   状态样式
========================================================= */

function getStatusClass(status) {

    return "status status-" + status;

}


/* =========================================================
   阅读跨度
========================================================= */

function getReadingDays(book) {

    if (!book.startDate) {

        return null;

    }


    const start =
        new Date(book.startDate);


    let end;


    if (book.endDate) {

        end = new Date(book.endDate);

    } else {

        end = new Date();

    }


    const diff =
        Math.floor(
            (end - start) /
            (1000 * 60 * 60 * 24)
        );


    return Math.max(diff + 1, 1);

}


/* =========================================================
   日期格式
========================================================= */

function formatDate(date) {

    if (!date) return "";

    const d = new Date(date);

    if (isNaN(d)) return date;

    return (
        d.getFullYear() +
        "." +
        String(d.getMonth() + 1).padStart(2, "0") +
        "." +
        String(d.getDate()).padStart(2, "0")
    );

}


/* =========================================================
   日期范围
========================================================= */

function getDateRange(book) {

    if (!book.startDate) {

        return "未记录阅读时间";

    }


    const start =
        formatDate(book.startDate);


    if (!book.endDate) {

        return `${start} - 至今`;

    }


    return `${start} - ${formatDate(book.endDate)}`;

}


/* =========================================================
   小说列表
========================================================= */

function renderBooks() {

    const list =
        document.getElementById("bookList");

    const search =
        document.getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    const filter =
        document.getElementById("statusFilter")
            .value;


    let filtered =
        books.filter(book => {

            const matchesStatus =
                filter === "all" ||
                book.status === filter;


            const searchable = [

                book.title,

                book.author,

                book.protagonist,

                ...(book.tags || [])

            ]
            .join(" ")
            .toLowerCase();


            const matchesSearch =
                !search ||
                searchable.includes(search);


            return matchesStatus &&
                   matchesSearch;

        });


    if (filtered.length === 0) {

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">📖</div>

                <div>还没有找到小说</div>

                <div style="font-size:12px;margin-top:6px">
                    开始记录你的阅读吧
                </div>

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered
        .map(book => {

            const days =
                getReadingDays(book);


            const tags =
                (book.tags || [])
                .map(tag =>
                    `<span class="tag">${escapeHtml(tag)}</span>`
                )
                .join("");


            const stars =
                "★".repeat(book.rating || 0) +
                "☆".repeat(5 - (book.rating || 0));


            return `

                <div class="book-item">

                    <div class="book-main">

                        <div class="book-info">

                            <div class="book-title">
                                ${escapeHtml(book.title)}
                            </div>

                            <div class="book-meta">

                                ${book.author
                                    ? `作者：${escapeHtml(book.author)}`
                                    : ""}

                                ${book.protagonist
                                    ? `　主角：${escapeHtml(book.protagonist)}`
                                    : ""}

                                <br>

                                ${getDateRange(book)}

                                ${
                                    days
                                    ? `　·　${days}天`
                                    : ""
                                }

                            </div>

                        </div>


                        <div class="book-side">

                            <div class="book-words">
                                ${book.words || 0}w
                            </div>

                            <div class="book-date">

                                <span class="${getStatusClass(book.status)}">
                                    ${getStatusText(book.status)}
                                </span>

                            </div>

                        </div>

                    </div>


                    <div class="book-bottom">

                        <div>

                            <div class="tags">

                                ${tags}

                            </div>

                            ${
                                book.rating
                                ? `<div style="
                                    margin-top:6px;
                                    color:#b28c54;
                                    font-size:13px;
                                ">${stars}</div>`
                                : ""
                            }

                        </div>


                        <div class="book-actions">

                            <button
                                class="small-btn"
                                onclick="viewBook('${book.id}')"
                            >
                                查看
                            </button>

                            <button
                                class="small-btn"
                                onclick="openEditModal('${book.id}')"
                            >
                                编辑
                            </button>

                            <button
                                class="small-btn"
                                onclick="deleteBook('${book.id}')"
                            >
                                删除
                            </button>

                        </div>

                    </div>

                </div>

            `;

        })
        .join("");

}


/* =========================================================
   查看小说详情
========================================================= */

function viewBook(id) {

    const book =
        books.find(b => b.id === id);

    if (!book) return;


    const days =
        getReadingDays(book);


    const stars =
        "★".repeat(book.rating || 0) +
        "☆".repeat(5 - (book.rating || 0));


    const tags =
        (book.tags || [])
        .map(t => `<span class="tag">${escapeHtml(t)}</span>`)
        .join("");


    const message = [

        `《${book.title}》`,

        book.author
            ? `作者：${book.author}`
            : "",

        book.protagonist
            ? `主角：${book.protagonist}`
            : "",

        `字数：${book.words || 0}w`,

        `状态：${getStatusText(book.status)}`,

        book.startDate
            ? `阅读时间：${getDateRange(book)}`
            : "",

        days
            ? `阅读跨度：${days}天`
            : "",

        book.rating
            ? `评分：${stars}`
            : "",

        book.tags?.length
            ? `标签：${book.tags.join("、")}`
            : "",

        "",

        "【个人感受】",

        book.feeling || "暂无",

        "",

        "【名场面 / 备注】",

        book.note || "暂无"

    ]
    .filter(Boolean)
    .join("\n");


    alert(message);

}


/* =========================================================
   统计
========================================================= */

function renderStats() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        now.getMonth() + 1;


    const yearBooks =
        books.filter(book => {

            if (!book.startDate) return false;

            return (
                new Date(book.startDate)
                    .getFullYear() === year
            );

        });


    const yearWords =
        yearBooks
        .reduce(
            (sum, book) =>
                sum + Number(book.words || 0),
            0
        );


    const monthBooks =
        yearBooks.filter(book => {

            return (
                new Date(book.startDate)
                    .getMonth() + 1 === month
            );

        });


    const monthWords =
        monthBooks
        .reduce(
            (sum, book) =>
                sum + Number(book.words || 0),
            0
        );


    document.getElementById("yearWords")
        .textContent =
        formatNumber(yearWords);


    document.getElementById("monthWords")
        .textContent =
        formatNumber(monthWords);


    document.getElementById("yearBooks")
        .textContent =
        yearBooks.length;


    document.getElementById("totalBooks")
        .textContent =
        books.length;

}


/* =========================================================
   月度列表
========================================================= */

function renderMonthList() {

    const container =
        document.getElementById("monthList");


    const year =
        new Date().getFullYear();


    const data = [];


    for (let i = 1; i <= 12; i++) {

        const total =
            books
            .filter(book => {

                if (!book.startDate) return false;

                const d =
                    new Date(book.startDate);

                return (
                    d.getFullYear() === year &&
                    d.getMonth() + 1 === i
                );

            })
            .reduce(
                (sum, book) =>
                    sum + Number(book.words || 0),
                0
            );


        data.push(total);

    }


    const max =
        Math.max(...data, 1);


    container.innerHTML =
        data.map((value, index) => {

            const percent =
                value / max * 100;


            return `

                <div class="month-row">

                    <div class="month-name">
                        ${index + 1}月
                    </div>

                    <div class="bar-bg">

                        <div
                            class="bar"
                            style="width:${percent}%"
                        ></div>

                    </div>

                    <div class="month-value">
                        ${formatNumber(value)}w
                    </div>

                </div>

            `;

        }).join("");

}


/* =========================================================
   年度图表
========================================================= */

function initializeYearSelect() {

    const select =
        document.getElementById("chartYear");


    const years =
        new Set();


    const current =
        new Date().getFullYear();


    years.add(current);


    books.forEach(book => {

        if (book.startDate) {

            years.add(
                new Date(book.startDate)
                    .getFullYear()
            );

        }

    });


    select.innerHTML =
        [...years]
        .sort((a,b) => b-a)
        .map(year =>
            `<option value="${year}">
                ${year}
            </option>`
        )
        .join("");

}


function renderChart() {

    const year =
        Number(
            document.getElementById("chartYear")
                .value
        );


    document.getElementById("chartTitle")
        .textContent =
        `${year} 年阅读趋势`;


    const data = [];


    for (let month = 1; month <= 12; month++) {

        const total =
            books
            .filter(book => {

                if (!book.startDate) return false;

                const d =
                    new Date(book.startDate);

                return (
                    d.getFullYear() === year &&
                    d.getMonth() + 1 === month
                );

            })
            .reduce(
                (sum, book) =>
                    sum + Number(book.words || 0),
                0
            );


        data.push(total);

    }


    const max =
        Math.max(...data, 1);


    const chart =
        document.getElementById("chart");


    chart.innerHTML =
        data.map((value, index) => {

            const height =
                value / max * 150;


            return `

                <div class="chart-column">

                    <div class="chart-value">
                        ${value
                            ? formatNumber(value) + "w"
                            : ""}
                    </div>

                    <div
                        class="chart-bar"
                        style="height:${height}px"
                        title="${value}w"
                    ></div>

                    <div class="chart-label">
                        ${index + 1}月
                    </div>

                </div>

            `;

        }).join("");

}


/* =========================================================
   时间线
========================================================= */

function renderTimeline() {

    const container =
        document.getElementById("timeline");


    const timelineBooks =
        [...books]
        .filter(book => book.startDate)
        .sort(
            (a,b) =>
                new Date(b.startDate) -
                new Date(a.startDate)
        )
        .slice(0, 10);


    if (timelineBooks.length === 0) {

        container.innerHTML = `
            <div style="
                color:var(--subtext);
                font-size:13px;
            ">
                暂无阅读时间记录
            </div>
        `;

        return;

    }


    container.innerHTML =
        timelineBooks
        .map(book => {

            return `

                <div class="timeline-item">

                    <div class="timeline-date">

                        ${formatDate(book.startDate)}

                    </div>

                    <div class="timeline-title">

                        ${escapeHtml(book.title)}

                    </div>

                </div>

            `;

        })
        .join("");

}


/* =========================================================
   星级评分
========================================================= */

function setupRating() {

    document
        .querySelectorAll(".star")
        .forEach(star => {

            star.addEventListener(
                "click",
                () => {

                    currentRating =
                        Number(
                            star.dataset.rating
                        );

                    updateStars();

                }
            );

        });

}


function updateStars() {

    document
        .querySelectorAll(".star")
        .forEach(star => {

            const rating =
                Number(star.dataset.rating);


            star.classList.toggle(
                "active",
                rating <= currentRating
            );

        });

}


/* =========================================================
   导出
========================================================= */

function exportData() {

    const data =
        JSON.stringify(
            books,
            null,
            2
        );


    const blob =
        new Blob(
            [data],
            {
                type: "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    const date =
        new Date()
        .toISOString()
        .slice(0,10);


    a.href = url;

    a.download =
        `reading-record-${date}.json`;

    a.click();


    URL.revokeObjectURL(url);

    showToast("数据已导出");

}


/* =========================================================
   导入
========================================================= */

function importData(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload = function(e) {

        try {

            const imported =
                JSON.parse(e.target.result);


            if (!Array.isArray(imported)) {

                throw new Error();

            }


            if (
                !confirm(
                    `发现 ${imported.length} 条记录。\n\n` +
                    `导入后将覆盖当前数据，确定继续吗？`
                )
            ) {

                return;

            }


            books = imported;

            saveToStorage();

            initializeYearSelect();

            renderAll();

            showToast("数据导入成功");

        } catch (error) {

            alert(
                "导入失败：文件格式不正确。"
            );

        }

    };


    reader.readAsText(file);

}


/* =========================================================
   总刷新
========================================================= */

function renderAll() {

    renderStats();

    renderBooks();

    renderMonthList();

    initializeYearSelect();

    renderChart();

    renderTimeline();

}


/* =========================================================
   工具函数
========================================================= */

function formatNumber(number) {

    return Number(number)
        .toLocaleString(
            "zh-CN",
            {
                maximumFractionDigits: 1
            }
        );

}


function escapeHtml(text) {

    if (text === null ||
        text === undefined) {

        return "";

    }


    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function showToast(message) {

    const toast =
        document.getElementById("toast");


    toast.textContent =
        message;


    toast.classList.add("show");


    setTimeout(
        () => {
            toast.classList.remove("show");
        },
        2000
    );

}


/* =========================================================
   点击弹窗外部关闭
========================================================= */

document
    .getElementById("bookModal")
    .addEventListener(
        "click",
        function(e) {

            if (e.target === this) {

                closeModal();

            }

        }
    );


/* =========================================================
   ESC关闭
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Escape") {

            closeModal();

        }

    }
);

</script>
