<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的阅读记录</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f6f3ee;
            color: #403b36;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }


        /* =========================
           顶部
        ========================= */

        header {
            background: #ffffff;
            border-bottom: 1px solid #e8e1d8;
            padding: 30px 6%;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            font-weight: 700;
        }

        .subtitle {
            color: #8b8177;
            font-size: 14px;
        }


        /* =========================
           主体
        ========================= */

        main {
            width: 100%;
            max-width: 1100px;
            margin: 28px auto;
            padding: 0 20px;
        }


        /* =========================
           工具栏
        ========================= */

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #ddd5cc;
            border-radius: 9px;
            background: #ffffff;
            color: #403b36;
            padding: 11px 12px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #9aa88a;
        }

        textarea {
            min-height: 110px;
            max-height: 110px;

            /*
             * 关键：
             * 禁止用户拖动文本框改变大小
             */
            resize: none;

            line-height: 1.6;
        }

        .btn {
            border: 0;
            border-radius: 9px;
            padding: 10px 16px;
            transition: 0.15s;
        }

        .btn:hover {
            opacity: 0.88;
        }

        .btn-primary {
            background: #69795c;
            color: #ffffff;
        }

        .btn-secondary {
            background: #ffffff;
            color: #514a43;
            border: 1px solid #ddd5cc;
        }

        .btn-danger {
            background: #fff1ef;
            color: #b55347;
        }


        /* =========================
           统计卡片
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #e8e1d8;
            border-radius: 14px;
            padding: 18px;
        }

        .stat-label {
            color: #91877e;
            font-size: 13px;
        }

        .stat-value {
            margin-top: 7px;
            font-size: 25px;
            font-weight: 700;
        }


        /* =========================
           内容布局
        ========================= */

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 18px;
            align-items: start;
        }

        .panel {
            background: #ffffff;
            border: 1px solid #e8e1d8;
            border-radius: 14px;
            padding: 18px;
        }

        .panel-title {
            margin: 0 0 16px;
            font-size: 18px;
        }


        /* =========================
           小说卡片
        ========================= */

        .book-card {
            background: #ffffff;
            border: 1px solid #e8e1d8;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .book-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .book-title {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.4;
        }

        .book-meta {
            margin-top: 7px;
            color: #8d847b;
            font-size: 13px;
            line-height: 1.8;
        }

        .book-words {
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status {
            display: inline-block;
            margin-top: 5px;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
        }

        .status-reading {
            background: #edf3e8;
            color: #637452;
        }

        .status-finished {
            background: #eeeaf6;
            color: #71628b;
        }

        .status-want {
            background: #f5eee1;
            color: #947548;
        }

        .status-dropped {
            background: #f6e9e6;
            color: #a86459;
        }

        .tags {
            margin-top: 10px;
        }

        .tag {
            display: inline-block;
            margin: 3px 4px 3px 0;
            padding: 4px 9px;
            background: #f1eee9;
            border-radius: 20px;
            font-size: 12px;
            color: #716a63;
        }

        .rating {
            margin-top: 8px;
            color: #c28d45;
            letter-spacing: 2px;
        }

        .book-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .small-btn {
            border: 0;
            border-radius: 8px;
            padding: 7px 11px;
            background: #f5f2ed;
            color: #5c554e;
        }

        .small-btn:hover {
            background: #ece8e1;
        }


        /* =========================
           空状态
        ========================= */

        .empty {
            text-align: center;
            padding: 55px 20px;
            color: #99918a;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }


        /* =========================
           月度统计
        ========================= */

        .month-row {
            display: grid;
            grid-template-columns: 35px 1fr 55px;
            align-items: center;
            gap: 8px;
            margin: 11px 0;
            font-size: 12px;
        }

        .progress-bg {
            height: 10px;
            background: #eeeae4;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: #8b9a78;
            border-radius: 10px;
        }


        /* =========================
           最近阅读
        ========================= */

        .timeline-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee8e1;
        }

        .timeline-item:last-child {
            border-bottom: 0;
        }

        .timeline-date {
            font-size: 12px;
            color: #978e85;
        }

        .timeline-title {
            margin-top: 4px;
            font-size: 14px;
            font-weight: 600;
        }


        /* =========================
           弹窗
        ========================= */

        .modal {
            position: fixed;
            inset: 0;

            z-index: 1000;

            /*
             * 不使用 align-items:center
             * 防止窗口太高时顶部被截掉
             */
            display: none;

            align-items: flex-start;
            justify-content: center;

            padding: 40px 20px;

            background: rgba(0, 0, 0, 0.45);

            /*
             * 页面本身可以滚动
             */
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            position: relative;

            width: min(680px, 100%);

            /*
             * 最大高度不能超过浏览器窗口
             */
            max-height: calc(100vh - 80px);

            margin: 0 auto;

            background: #ffffff;

            border-radius: 16px;

            padding: 24px;

            /*
             * 如果表单内容太长，
             * 只让弹窗内部滚动
             */
            overflow-y: auto;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.18);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;

            position: sticky;
            top: -24px;

            padding-top: 2px;
            padding-bottom: 14px;

            background: #ffffff;

            z-index: 2;
        }

        .modal-head h2 {
            margin: 0;
            font-size: 21px;
        }

        .close-button {
            border: 0;
            background: transparent;
            color: #777;
            font-size: 28px;
            line-height: 1;
            padding: 3px 7px;
        }

        .close-button:hover {
            color: #333;
        }


        /* =========================
           表单
        ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-field.full {
            grid-column: 1 / -1;
        }

        .form-field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #6f675f;
        }

        .form-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;

            margin-top: 20px;

            padding-top: 16px;

            border-top: 1px solid #eee8e1;

            position: sticky;
            bottom: -24px;

            background: #ffffff;
        }


        /* =========================
           星星
        ========================= */

        .star-rating {
            display: flex;
            gap: 5px;
            font-size: 28px;
        }

        .star {
            color: #d3ccc3;
            cursor: pointer;
            user-select: none;
        }

        .star.active {
            color: #c28d45;
        }


        /* =========================
           详情
        ========================= */

        .detail-row {
            padding: 13px 0;
            border-bottom: 1px solid #eee8e1;
        }

        .detail-row:last-child {
            border-bottom: 0;
        }

        .detail-label {
            color: #978e85;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .detail-text {
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }


        /* =========================
           Toast
        ========================= */

        .toast {
            position: fixed;
            z-index: 2000;

            left: 50%;
            bottom: 30px;

            transform: translateX(-50%);

            display: none;

            padding: 10px 18px;

            border-radius: 9px;

            background: #403b36;
            color: #ffffff;

            font-size: 14px;
        }

        .toast.show {
            display: block;
        }


        /* =========================
           响应式
        ========================= */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 600px) {

            header {
                padding: 25px 20px;
            }

            main {
                margin-top: 20px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-field.full {
                grid-column: auto;
            }

            .modal {
                padding: 20px 12px;
            }

            .modal-box {
                max-height: calc(100vh - 40px);
                padding: 18px;
            }

            .modal-head {
                top: -18px;
            }

        }


    </style>
</head>


<body>


<!-- =========================
     顶部
========================= -->

<header>

    <div class="header-inner">

        <h1>
            我的阅读记录
        </h1>

        <div class="subtitle">
            记录读过的小说，也记录读完之后还剩多少余味。
        </div>

    </div>

</header>



<main>


    <!-- =========================
         工具栏
    ========================= -->

    <div class="toolbar">

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="搜索小说、作者、主角、标签……"
            >

        </div>


        <div style="width:140px">

            <select id="statusFilter">

                <option value="all">
                    全部状态
                </option>

                <option value="reading">
                    在读
                </option>

                <option value="finished">
                    已完成
                </option>

                <option value="want">
                    想读
                </option>

                <option value="dropped">
                    弃读
                </option>

            </select>

        </div>


        <button
            class="btn btn-primary"
            id="addBookBtn"
        >
            ＋ 添加小说
        </button>


        <button
            class="btn btn-secondary"
            id="exportBtn"
        >
            导出数据
        </button>


        <button
            class="btn btn-secondary"
            id="importBtn"
        >
            导入数据
        </button>


        <input
            id="importFile"
            type="file"
            accept=".json"
            style="display:none"
        >

    </div>



    <!-- =========================
         统计
    ========================= -->

    <section class="stats">


        <div class="stat-card">

            <div class="stat-label">
                今年阅读字数
            </div>

            <div
                class="stat-value"
                id="yearWords"
            >
                0w
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                本月阅读字数
            </div>

            <div
                class="stat-value"
                id="monthWords"
            >
                0w
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                今年完成小说
            </div>

            <div
                class="stat-value"
                id="yearBooks"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                累计记录
            </div>

            <div
                class="stat-value"
                id="totalBooks"
            >
                0
            </div>

        </div>


    </section>



    <!-- =========================
         内容
    ========================= -->

    <div class="content-grid">


        <!-- 小说列表 -->

        <section>

            <div id="bookList"></div>

        </section>



        <!-- 右侧统计 -->

        <aside>


            <div class="panel">

                <h2 class="panel-title">
                    今年每月阅读量
                </h2>

                <div id="monthList"></div>

            </div>



            <div
                class="panel"
                style="margin-top:18px"
            >

                <h2 class="panel-title">
                    最近开始阅读
                </h2>

                <div id="timeline"></div>

            </div>


        </aside>


    </div>


</main>



<!-- ==================================================
     添加 / 编辑小说弹窗
================================================== -->

<div
    class="modal"
    id="bookModal"
>


    <div class="modal-box">


        <div class="modal-head">

            <h2 id="modalTitle">
                添加小说
            </h2>


            <button
                class="close-button"
                id="closeModalBtn"
                type="button"
            >
                ×
            </button>

        </div>



        <div class="form-grid">


            <!-- 小说名称 -->

            <div class="form-field">

                <label>
                    小说名称 *
                </label>

                <input
                    id="bookTitle"
                    type="text"
                    placeholder="例如：XXX"
                >

            </div>



            <!-- 作者 -->

            <div class="form-field">

                <label>
                    作者
                </label>

                <input
                    id="bookAuthor"
                    type="text"
                    placeholder="作者名称"
                >

            </div>



            <!-- 主角 -->

            <div class="form-field">

                <label>
                    主角
                </label>

                <input
                    id="bookProtagonist"
                    type="text"
                    placeholder="主角名称"
                >

            </div>



            <!-- 字数 -->

            <div class="form-field">

                <label>
                    字数（w）
                </label>

                <input
                    id="bookWords"
                    type="number"
                    min="0"
                    step="0.1"
                    placeholder="例如：120"
                >

            </div>



            <!-- 状态 -->

            <div class="form-field">

                <label>
                    阅读状态
                </label>

                <select id="bookStatus">

                    <option value="reading">
                        在读
                    </option>

                    <option value="finished">
                        已完成
                    </option>

                    <option value="want">
                        想读
                    </option>

                    <option value="dropped">
                        弃读
                    </option>

                </select>

            </div>



            <!-- 标签 -->

            <div class="form-field">

                <label>
                    标签
                </label>

                <input
                    id="bookTags"
                    type="text"
                    placeholder="多个标签用逗号分隔"
                >

            </div>



            <!-- 开始时间 -->

            <div class="form-field">

                <label>
                    开始阅读
                </label>

                <input
                    id="startDate"
                    type="date"
                >

            </div>



            <!-- 结束时间 -->

            <div class="form-field">

                <label>
                    结束阅读
                </label>

                <input
                    id="endDate"
                    type="date"
                >

            </div>



            <!-- 评分 -->

            <div class="form-field full">

                <label>
                    评分
                </label>

                <div
                    class="star-rating"
                    id="starRating"
                >

                    <span
                        class="star"
                        data-rating="1"
                    >
                        ★
                    </span>

                    <span
                        class="star"
                        data-rating="2"
                    >
                        ★
                    </span>

                    <span
                        class="star"
                        data-rating="3"
                    >
                        ★
                    </span>

                    <span
                        class="star"
                        data-rating="4"
                    >
                        ★
                    </span>

                    <span
                        class="star"
                        data-rating="5"
                    >
                        ★
                    </span>

                </div>

            </div>



            <!-- 个人感受 -->

            <div class="form-field full">

                <label>
                    个人感受
                </label>

                <textarea
                    id="bookFeeling"
                    placeholder="记录一下读完这本小说之后的感受……"
                ></textarea>

            </div>



            <!-- 备注 -->

            <div class="form-field full">

                <label>
                    名场面 / 备注
                </label>

                <textarea
                    id="bookNote"
                    placeholder="可以记录喜欢的情节、名场面、吐槽等……"
                ></textarea>

            </div>


        </div>



        <div class="form-footer">


            <button
                class="btn btn-secondary"
                id="cancelBtn"
                type="button"
            >
                取消
            </button>


            <button
                class="btn btn-primary"
                id="saveBtn"
                type="button"
            >
                保存
            </button>


        </div>


    </div>


</div>



<!-- ==================================================
     查看详情弹窗
================================================== -->

<div
    class="modal"
    id="detailModal"
>


    <div class="modal-box">


        <div class="modal-head">

            <h2 id="detailTitle">
                小说详情
            </h2>


            <button
                class="close-button"
                id="closeDetailBtn"
                type="button"
            >
                ×
            </button>

        </div>


        <div id="detailContent"></div>


        <div class="form-footer">

            <button
                class="btn btn-secondary"
                id="closeDetailButton"
                type="button"
            >
                关闭
            </button>

        </div>


    </div>


</div>



<!-- Toast -->

<div
    class="toast"
    id="toast"
></div>



<script>


/* ==================================================
   数据
================================================== */

let books = [];

let editingId = null;

let currentRating = 0;



/* ==================================================
   初始化
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadData();

        bindEvents();

        renderAll();

    }
);



/* ==================================================
   LocalStorage
================================================== */

function loadData() {

    try {

        const data =
            localStorage.getItem(
                "readingTrackerBooks"
            );


        if (data) {

            const parsed =
                JSON.parse(data);


            if (
                Array.isArray(parsed)
            ) {

                books = parsed;

            }

        }

    } catch (error) {

        console.error(error);

        books = [];

    }

}


function saveData() {

    localStorage.setItem(
        "readingTrackerBooks",
        JSON.stringify(books)
    );

}



/* ==================================================
   事件
================================================== */

function bindEvents() {


    document
        .getElementById("addBookBtn")
        .addEventListener(
            "click",
            openAddModal
        );


    document
        .getElementById("closeModalBtn")
        .addEventListener(
            "click",
            closeBookModal
        );


    document
        .getElementById("cancelBtn")
        .addEventListener(
            "click",
            closeBookModal
        );


    document
        .getElementById("saveBtn")
        .addEventListener(
            "click",
            saveBook
        );


    document
        .getElementById("closeDetailBtn")
        .addEventListener(
            "click",
            closeDetailModal
        );


    document
        .getElementById("closeDetailButton")
        .addEventListener(
            "click",
            closeDetailModal
        );


    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            renderBooks
        );


    document
        .getElementById("statusFilter")
        .addEventListener(
            "change",
            renderBooks
        );


    document
        .getElementById("exportBtn")
        .addEventListener(
            "click",
            exportData
        );


    document
        .getElementById("importBtn")
        .addEventListener(
            "click",
            function () {

                document
                    .getElementById("importFile")
                    .click();

            }
        );


    document
        .getElementById("importFile")
        .addEventListener(
            "change",
            importData
        );


    document
        .querySelectorAll(".star")
        .forEach(
            function (star) {

                star.addEventListener(
                    "click",
                    function () {

                        currentRating =
                            Number(
                                this.dataset.rating
                            );

                        updateStars();

                    }
                );

            }
        );

}



/* ==================================================
   添加小说
================================================== */

function openAddModal() {

    editingId = null;

    document
        .getElementById("modalTitle")
        .textContent =
        "添加小说";


    document
        .getElementById("bookTitle")
        .value = "";


    document
        .getElementById("bookAuthor")
        .value = "";


    document
        .getElementById("bookProtagonist")
        .value = "";


    document
        .getElementById("bookWords")
        .value = "";


    document
        .getElementById("bookStatus")
        .value =
        "reading";


    document
        .getElementById("bookTags")
        .value = "";


    document
        .getElementById("startDate")
        .value = "";


    document
        .getElementById("endDate")
        .value = "";


    document
        .getElementById("bookFeeling")
        .value = "";


    document
        .getElementById("bookNote")
        .value = "";


    currentRating = 0;

    updateStars();


    document
        .getElementById("bookModal")
        .classList.add("show");

}



/* ==================================================
   编辑小说
================================================== */

function openEditModal(id) {

    const book =
        books.find(
            function (item) {

                return item.id === id;

            }
        );


    if (!book) {

        return;

    }


    editingId = id;


    document
        .getElementById("modalTitle")
        .textContent =
        "编辑小说";


    document
        .getElementById("bookTitle")
        .value =
        book.title || "";


    document
        .getElementById("bookAuthor")
        .value =
        book.author || "";


    document
        .getElementById("bookProtagonist")
        .value =
        book.protagonist || "";


    document
        .getElementById("bookWords")
        .value =
        book.words || "";


    document
        .getElementById("bookStatus")
        .value =
        book.status || "reading";


    document
        .getElementById("bookTags")
        .value =
        Array.isArray(book.tags)
            ? book.tags.join(",")
            : "";


    document
        .getElementById("startDate")
        .value =
        book.startDate || "";


    document
        .getElementById("endDate")
        .value =
        book.endDate || "";


    document
        .getElementById("bookFeeling")
        .value =
        book.feeling || "";


    document
        .getElementById("bookNote")
        .value =
        book.note || "";


    currentRating =
        Number(
            book.rating || 0
        );


    updateStars();


    document
        .getElementById("bookModal")
        .classList.add("show");

}



/* ==================================================
   保存
================================================== */

function saveBook() {


    const title =
        document
            .getElementById("bookTitle")
            .value
            .trim();


    if (!title) {

        alert(
            "请输入小说名称。"
        );

        return;

    }


    const tags =
        document
            .getElementById("bookTags")
            .value
            .split(",")
            .map(
                function (tag) {

                    return tag.trim();

                }
            )
            .filter(
                function (tag) {

                    return tag !== "";

                }
            );


    const book = {


        id:
            editingId ||
            Date.now().toString(),


        title:
            title,


        author:
            document
                .getElementById("bookAuthor")
                .value
                .trim(),


        protagonist:
            document
                .getElementById("bookProtagonist")
                .value
                .trim(),


        words:
            Number(
                document
                    .getElementById("bookWords")
                    .value
            ) || 0,


        status:
            document
                .getElementById("bookStatus")
                .value,


        tags:
            tags,


        rating:
            currentRating,


        startDate:
            document
                .getElementById("startDate")
                .value,


        endDate:
            document
                .getElementById("endDate")
                .value,


        feeling:
            document
                .getElementById("bookFeeling")
                .value
                .trim(),


        note:
            document
                .getElementById("bookNote")
                .value
                .trim()


    };


    if (editingId) {


        const index =
            books.findIndex(
                function (item) {

                    return item.id === editingId;

                }
            );


        if (index !== -1) {

            books[index] = book;

        }


    } else {

        books.unshift(book);

    }


    saveData();

    closeBookModal();

    renderAll();

    showToast(
        editingId
            ? "小说已更新"
            : "小说已添加"
    );


}



/* ==================================================
   关闭弹窗
================================================== */

function closeBookModal() {

    document
        .getElementById("bookModal")
        .classList.remove("show");


    editingId = null;

}


function closeDetailModal() {

    document
        .getElementById("detailModal")
        .classList.remove("show");

}



/* ==================================================
   小说列表
================================================== */

function renderBooks() {


    const container =
        document.getElementById(
            "bookList"
        );


    const keyword =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    const status =
        document
            .getElementById("statusFilter")
            .value;


    const filtered =
        books.filter(
            function (book) {


                const statusOK =
                    status === "all" ||
                    book.status === status;


                const text = [

                    book.title,

                    book.author,

                    book.protagonist,

                    ...(book.tags || [])

                ]
                    .join(" ")
                    .toLowerCase();


                return (

                    statusOK &&

                    (
                        keyword === "" ||
                        text.includes(keyword)
                    )

                );

            }
        );


    if (
        filtered.length === 0
    ) {


        container.innerHTML = `

            <div class="panel empty">

                <div class="empty-icon">
                    📖
                </div>

                <div>
                    ${
                        books.length === 0
                            ? "还没有记录小说"
                            : "没有找到符合条件的小说"
                    }
                </div>

                <div
                    style="
                        margin-top:8px;
                        font-size:12px;
                    "
                >
                    ${
                        books.length === 0
                            ? "点击右上角「添加小说」开始记录"
                            : "试试其他搜索条件"
                    }
                </div>

            </div>

        `;


        return;

    }



    container.innerHTML =

        filtered
            .map(
                function (book) {


                    const tags =
                        (book.tags || [])
                            .map(
                                function (tag) {

                                    return `

                                        <span class="tag">
                                            ${escapeHtml(tag)}
                                        </span>

                                    `;

                                }
                            )
                            .join("");


                    const rating =
                        Number(
                            book.rating || 0
                        );


                    const stars =
                        "★".repeat(rating) +
                        "☆".repeat(5 - rating);


                    return `

                        <article
                            class="book-card"
                        >


                            <div class="book-top">


                                <div>


                                    <div
                                        class="book-title"
                                    >
                                        ${escapeHtml(book.title)}
                                    </div>


                                    <div
                                        class="book-meta"
                                    >

                                        ${
                                            book.author
                                                ? "作者：" +
                                                  escapeHtml(book.author)
                                                : ""
                                        }

                                        ${
                                            book.protagonist
                                                ? "　主角：" +
                                                  escapeHtml(book.protagonist)
                                                : ""
                                        }

                                        <br>

                                        ${
                                            getDateRange(book)
                                        }

                                        ${
                                            getReadingDays(book)
                                                ? "　·　" +
                                                  getReadingDays(book) +
                                                  "天"
                                                : ""
                                        }

                                    </div>


                                </div>



                                <div>


                                    <div
                                        class="book-words"
                                    >
                                        ${formatNumber(book.words)}w
                                    </div>


                                    <span
                                        class="
                                            status
                                            status-${book.status}
                                        "
                                    >

                                        ${getStatusText(book.status)}

                                    </span>


                                </div>


                            </div>



                            <div class="tags">

                                ${tags}

                            </div>



                            ${
                                rating
                                    ? `
                                        <div class="rating">
                                            ${stars}
                                        </div>
                                    `
                                    : ""
                            }



                            <div class="book-actions">


                                <button
                                    class="small-btn"
                                    onclick="
                                        viewBook('${book.id}')
                                    "
                                >
                                    查看
                                </button>


                                <button
                                    class="small-btn"
                                    onclick="
                                        openEditModal('${book.id}')
                                    "
                                >
                                    编辑
                                </button>


                                <button
                                    class="small-btn"
                                    onclick="
                                        deleteBook('${book.id}')
                                    "
                                >
                                    删除
                                </button>


                            </div>


                        </article>

                    `;

                }
            )
            .join("");

}



/* ==================================================
   查看详情
================================================== */

function viewBook(id) {


    const book =
        books.find(
            function (item) {

                return item.id === id;

            }
        );


    if (!book) {

        return;

    }


    const rating =
        Number(
            book.rating || 0
        );


    const stars =
        "★".repeat(rating) +
        "☆".repeat(5 - rating);


    document
        .getElementById("detailTitle")
        .textContent =
        book.title;


    document
        .getElementById("detailContent")
        .innerHTML = `


            <div class="detail-row">

                <div class="detail-label">
                    作者
                </div>

                <div class="detail-text">
                    ${escapeHtml(book.author || "未记录")}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    主角
                </div>

                <div class="detail-text">
                    ${escapeHtml(book.protagonist || "未记录")}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    字数
                </div>

                <div class="detail-text">
                    ${formatNumber(book.words)}w
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    阅读状态
                </div>

                <div class="detail-text">
                    ${getStatusText(book.status)}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    阅读时间
                </div>

                <div class="detail-text">

                    ${getDateRange(book)}

                    ${
                        getReadingDays(book)
                            ? "　·　" +
                              getReadingDays(book) +
                              "天"
                            : ""
                    }

                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    评分
                </div>

                <div class="rating">
                    ${stars}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    标签
                </div>

                <div>

                    ${
                        (book.tags || [])
                            .map(
                                function (tag) {

                                    return `
                                        <span class="tag">
                                            ${escapeHtml(tag)}
                                        </span>
                                    `;

                                }
                            )
                            .join("")
                        ||
                        "暂无"
                    }

                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    个人感受
                </div>

                <div class="detail-text">
                    ${escapeHtml(book.feeling || "暂无记录")}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    名场面 / 备注
                </div>

                <div class="detail-text">
                    ${escapeHtml(book.note || "暂无记录")}
                </div>

            </div>


        `;


    document
        .getElementById("detailModal")
        .classList.add("show");

}



/* ==================================================
   删除
================================================== */

function deleteBook(id) {


    const book =
        books.find(
            function (item) {

                return item.id === id;

            }
        );


    if (!book) {

        return;

    }


    if (
        !confirm(
            "确定删除《" +
            book.title +
            "》吗？"
        )
    ) {

        return;

    }


    books =
        books.filter(
            function (item) {

                return item.id !== id;

            }
        );


    saveData();

    renderAll();

    showToast(
        "小说已删除"
    );

}



/* ==================================================
   统计
================================================== */

function renderStats() {


    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        now.getMonth() + 1;


    const yearBooks =
        books.filter(
            function (book) {


                if (!book.startDate) {

                    return false;

                }


                const date =
                    new Date(
                        book.startDate
                    );


                return (
                    date.getFullYear() === year
                );

            }
        );


    const yearWords =
        yearBooks.reduce(
            function (sum, book) {

                return (
                    sum +
                    Number(
                        book.words || 0
                    )
                );

            },
            0
        );


    const monthWords =
        yearBooks
            .filter(
                function (book) {

                    const date =
                        new Date(
                            book.startDate
                        );


                    return (
                        date.getMonth() + 1 === month
                    );

                }
            )
            .reduce(
                function (sum, book) {

                    return (
                        sum +
                        Number(
                            book.words || 0
                        )
                    );

                },
                0
            );


    document
        .getElementById("yearWords")
        .textContent =
        formatNumber(yearWords) +
        "w";


    document
        .getElementById("monthWords")
        .textContent =
        formatNumber(monthWords) +
        "w";


    document
        .getElementById("yearBooks")
        .textContent =
        yearBooks.filter(
            function (book) {

                return (
                    book.status ===
                    "finished"
                );

            }
        ).length;


    document
        .getElementById("totalBooks")
        .textContent =
        books.length;

}



/* ==================================================
   月度统计
================================================== */

function renderMonthList() {


    const container =
        document.getElementById(
            "monthList"
        );


    const year =
        new Date().getFullYear();


    const values = [];


    for (
        let month = 1;
        month <= 12;
        month++
    ) {


        let total = 0;


        books.forEach(
            function (book) {


                if (!book.startDate) {

                    return;

                }


                const date =
                    new Date(
                        book.startDate
                    );


                if (

                    date.getFullYear() ===
                    year

                    &&

                    date.getMonth() + 1 ===
                    month

                ) {

                    total +=
                        Number(
                            book.words || 0
                        );

                }

            }
        );


        values.push(total);

    }


    const max =
        Math.max(
            ...values,
            1
        );


    container.innerHTML =
        values
            .map(
                function (value, index) {


                    const width =
                        value / max * 100;


                    return `

                        <div
                            class="month-row"
                        >

                            <div>
                                ${index + 1}月
                            </div>


                            <div
                                class="progress-bg"
                            >

                                <div
                                    class="progress"
                                    style="
                                        width:${width}%;
                                    "
                                ></div>

                            </div>


                            <div>
                                ${formatNumber(value)}w
                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}



/* ==================================================
   时间线
================================================== */

function renderTimeline() {


    const container =
        document.getElementById(
            "timeline"
        );


    const list =
        books
            .filter(
                function (book) {

                    return Boolean(
                        book.startDate
                    );

                }
            )
            .sort(
                function (a, b) {

                    return (
                        new Date(
                            b.startDate
                        ) -
                        new Date(
                            a.startDate
                        )
                    );

                }
            )
            .slice(
                0,
                8
            );


    if (
        list.length === 0
    ) {

        container.innerHTML =
            `
                <div
                    class="book-meta"
                >
                    暂无阅读时间记录
                </div>
            `;

        return;

    }


    container.innerHTML =
        list
            .map(
                function (book) {

                    return `

                        <div
                            class="timeline-item"
                        >

                            <div
                                class="timeline-date"
                            >
                                ${formatDate(book.startDate)}
                            </div>

                            <div
                                class="timeline-title"
                            >
                                ${escapeHtml(book.title)}
                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}



/* ==================================================
   星星
================================================== */

function updateStars() {


    document
        .querySelectorAll(".star")
        .forEach(
            function (star) {


                const rating =
                    Number(
                        star.dataset.rating
                    );


                if (
                    rating <=
                    currentRating
                ) {

                    star.classList.add(
                        "active"
                    );

                } else {

                    star.classList.remove(
                        "active"
                    );

                }

            }
        );

}



/* ==================================================
   导出
================================================== */

function exportData() {


    const blob =
        new Blob(
            [
                JSON.stringify(
                    books,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href = url;


    a.download =
        "我的阅读记录.json";


    document
        .body
        .appendChild(a);


    a.click();


    a.remove();


    URL.revokeObjectURL(
        url
    );


    showToast(
        "数据已导出"
    );

}



/* ==================================================
   导入
================================================== */

function importData(event) {


    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function (e) {


            try {


                const data =
                    JSON.parse(
                        e.target.result
                    );


                if (
                    !Array.isArray(data)
                ) {

                    throw new Error(
                        "invalid"
                    );

                }


                if (
                    !confirm(
                        "导入数据会覆盖当前阅读记录，确定继续吗？"
                    )
                ) {

                    return;

                }


                books = data;


                saveData();


                renderAll();


                showToast(
                    "数据导入成功"
                );


            } catch (error) {


                alert(
                    "导入失败：文件格式不正确。"
                );

            }

        };


    reader.readAsText(
        file
    );


    event.target.value = "";

}



/* ==================================================
   工具函数
================================================== */

function renderAll() {

    renderStats();

    renderBooks();

    renderMonthList();

    renderTimeline();

}


function getStatusText(status) {


    const map = {

        reading: "在读",

        finished: "已完成",

        want: "想读",

        dropped: "弃读"

    };


    return (
        map[status] ||
        "未知"
    );

}


function getReadingDays(book) {


    if (!book.startDate) {

        return null;

    }


    const start =
        new Date(
            book.startDate
        );


    const end =
        book.endDate
            ? new Date(
                book.endDate
            )
            : new Date();


    return Math.max(
        1,
        Math.floor(
            (
                end - start
            ) /
            86400000
        ) + 1
    );

}


function getDateRange(book) {


    if (!book.startDate) {

        return "未记录阅读时间";

    }


    if (!book.endDate) {

        return (
            formatDate(
                book.startDate
            ) +
            " - 至今"
        );

    }


    return (
        formatDate(
            book.startDate
        ) +
        " - " +
        formatDate(
            book.endDate
        )
    );

}


function formatDate(value) {


    if (!value) {

        return "";

    }


    const date =
        new Date(value);


    return (

        date.getFullYear() +
        "." +
        String(
            date.getMonth() + 1
        ).padStart(2, "0") +
        "." +
        String(
            date.getDate()
        ).padStart(2, "0")

    );

}


function formatNumber(value) {


    return Number(
        value || 0
    ).toLocaleString(
        "zh-CN",
        {
            maximumFractionDigits: 1
        }
    );

}


function escapeHtml(value) {


    return String(
        value || ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==================================================
   Toast
================================================== */

let toastTimer;


function showToast(message) {


    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function () {

                toast.classList.remove(
                    "show"
                );

            },
            2000
        );

}


</script>
